/* ---------- Dashboard ---------- */
function studentOverallStats(studentId){
  var lessons = studentLessons(studentId);
  var counts = {todo:0,doing:0,review:0,done:0};
  lessons.forEach(function(l){ counts[l.status] = (counts[l.status]||0)+1; });
  var subs = studentSubjects(studentId);
  var pcts = [];
  subs.forEach(function(su){
    var c = cumulativeAggregate(studentId, su.id);
    if(c) pcts.push(c.pct);
  });
  var overall = pcts.length ? pcts.reduce(function(a,b){return a+b;},0)/pcts.length : null;
  return {total:lessons.length, counts:counts, overall:overall};
}

function renderDashboard(){
  if(!state.data.students.length) return renderNoStudentsEmpty();
  // Only show students enrolled in the active year (a studentYearInfo
  // record for it) AND who actually have assignments entered that year —
  // e.g. a graduated student shouldn't show up on the Dashboard for a year
  // after they left, and a student enrolled but with nothing entered yet
  // (a fresh enrollment, or a historical-only test student) has nothing to
  // display. Deliberately not gated on having a *grade* yet — a student
  // with ungraded work in progress should still show; only "nothing
  // assigned at all" hides them.
  var enrolledStudents = state.data.students.filter(function(s){ return !!getStudentYearInfo(s.id, state.data.activeYearId); });
  var yearStudents = enrolledStudents.filter(function(s){ return studentLessons(s.id).length>0; });
  if(!yearStudents.length){
    var msg = enrolledStudents.length
      ? 'No assignments entered yet for '+esc(activeYear().label)+'. Add some in Planner — learners show up here once they have work.'
      : 'No learners enrolled in '+esc(activeYear().label)+'. Switch years above, or add one in Setup → Years.';
    return '<div class="section-head"><div><h2>Overview</h2><div class="hint">'+esc(activeYear().label)+' · today is '+fmtDate(todayStr())+'</div></div></div>'+
      '<p class="helptext">'+msg+'</p>';
  }
  var cards = yearStudents.map(function(s){
    var stats = studentOverallStats(s.id);
    var band = stats.overall!=null ? letterBand(stats.overall, state.data.scale) : null;
    var gradeLabel = gradeLabelFor(s.id, state.data.activeYearId) || s.gradeLevel || '';
    return '<div class="dash-card">'+
      '<div class="dash-card-head" style="background:var(--'+s.color+')">'+
        '<div><div style="font-family:var(--font-display);font-size:18px;font-weight:700;">'+esc(s.name)+'</div>'+
        '<div style="font-size:12px;opacity:.85;">'+esc(gradeLabel)+'</div></div>'+
        (stats.overall!=null ?
          '<div style="text-align:right;"><div style="font-family:var(--font-mono);font-size:22px;font-weight:600;">'+fmtPct(stats.overall)+'</div><div style="font-size:11px;opacity:.85;">'+esc(band?band.letter:'')+' average</div></div>' :
          '<div style="font-size:12px;opacity:.85;">No grades yet</div>') +
      '</div>'+
      '<div class="dash-card-body">'+
        '<div class="stat-grid">'+
          '<div class="stat"><div class="num">'+stats.counts.todo+'</div><div class="lbl">To do</div></div>'+
          '<div class="stat"><div class="num">'+stats.counts.doing+'</div><div class="lbl">Doing</div></div>'+
          '<div class="stat"><div class="num">'+stats.counts.review+'</div><div class="lbl">Review</div></div>'+
          '<div class="stat"><div class="num">'+stats.counts.done+'</div><div class="lbl">Done</div></div>'+
        '</div>'+
        (stats.counts.review>0 ? '<div class="banner" style="margin-bottom:10px;">'+stats.counts.review+' assignment'+(stats.counts.review===1?'':'s')+' waiting on your review</div>' : '') +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;">'+
          '<button class="btn btn-sm" data-action="open-student-view" data-id="'+s.id+'" data-view="planner">Open planner</button>'+
          '<button class="btn btn-sm" data-action="open-student-view" data-id="'+s.id+'" data-view="reports">View report</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');
  return '<div class="section-head"><div><h2>Overview</h2><div class="hint">'+yearStudents.length+' learner'+(yearStudents.length===1?'':'s')+' \u00b7 '+esc(activeYear().label)+' \u00b7 today is '+fmtDate(todayStr())+'</div></div></div>'+
    '<div class="dash-grid">'+cards+'</div>';
}

        '<button class="btn" data-action="import-back">Back</button>'+
        '<button class="btn btn-primary" data-action="import-confirm"'+(okCount===0?' disabled':'')+'>'+icon('check')+' Import '+okCount+' lesson'+(okCount===1?'':'s')+'</button>'+
      '</div>';
  }
  return '<div class="panel" style="margin-bottom:16px;"><div class="section-head"><h2 style="font-size:16px;">Import lessons</h2></div>'+body+'</div>';
}

        '<div class="field-row">'+
          '<div class="field"><label class="field-label">Subject</label><select id="pl-add-subject">'+subs.map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+'</option>';}).join('')+'</select></div>'+
          '<div class="field"><label class="field-label">Quarter</label><select id="pl-add-quarter">'+quarters.map(function(q){return '<option value="'+q.id+'"'+(filt.quarterId===q.id?' selected':'')+'>'+esc(q.name)+'</option>';}).join('')+'</select></div>'+
          '<div class="field"><label class="field-label">Lesson / assignment title</label><input type="text" id="pl-add-title" placeholder="e.g. Week 6 Q1, Chapter 4, Unit 9"></div>'+
          '<div class="field"><label class="field-label">Due date <span class="field-optional">(optional)</span></label><input type="date" id="pl-add-due"></div>'+
        '</div>'+
        '<div class="btn-row" style="display:flex;gap:8px;justify-content:flex-end;">'+
          '<button class="btn" data-action="planner-add-toggle">Cancel</button>'+
          '<button class="btn btn-primary" data-action="planner-add-submit">'+icon('plus')+' Add to To Do</button>'+
        '</div>'+
      '</div>';
    }

  var importPanel = renderPlannerImportPanel(student);

  var cols = STATUS_COLS.map(function(col){
    var items = lessons.filter(function(l){ return l.status===col.id; });
    var cards = items.length ? items.map(function(l){ return renderLessonCard(l, student, subs); }).join('') : '<div class="col-empty">Nothing here</div>';
    return '<div class="board-col"><div class="board-col-head"><span class="board-col-title">'+col.label+'</span><span class="board-count">'+items.length+'</span></div><div class="card-stack">'+cards+'</div></div>';
  }).join('');

  return '<div class="section-head"><div><h2>Planner</h2><div class="hint">'+esc(student.name)+'\u2019s lesson backlog, run like a sprint board \u00b7 '+esc(activeYear().label)+'</div></div>'+
      '<div style="display:flex;gap:8px;">'+
        '<button class="btn" data-action="planner-import-toggle">'+icon('upload')+' Import</button>'+
        '<button class="btn btn-primary" data-action="planner-add-toggle">'+icon('plus')+' Add lesson</button>'+
      '</div></div>'+
    addForm+importPanel+
    '<div class="filters-row"><select id="pl-filter-subject" data-action-change="planner-filter-subject">'+subjectOptions+'</select>'+
      '<select id="pl-filter-quarter" data-action-change="planner-filter-quarter">'+quarterOptions+'</select></div>'+
    (subs.length ? '<div class="board">'+cols+'</div>' :
      '<div class="empty-state"><h3>No subjects yet</h3><p>Add subjects for '+esc(student.name)+' in Setup, then come back to plan lessons.</p><button class="btn btn-primary" data-action="switch-view" data-view="setup">'+icon('plus')+' Go to Setup</button></div>');
}

/* ---------- Calendar ---------- */
function renderCalChip(l, student){
  var subj = getSubject(l.subjectId);
  return '<button class="cal-chip'+(l.status==='done'?' cal-chip-done':'')+'" style="--chip-accent:var(--'+student.color+')" data-action="calendar-open-lesson" data-id="'+l.id+'">'+
    '<span class="cal-chip-subj">'+esc(subj?subj.name:'?')+'</span>'+
    '<span class="cal-chip-title">'+esc(l.title||'(untitled)')+'</span>'+
  '</button>';
}
function renderCalendar(){
  var student = getStudent(state.activeStudentId);
  if(!student) return renderNoStudentsEmpty();
  if(!state.calendarWeekStart) state.calendarWeekStart = mondayOfStr(todayStr());
  var weekStart = state.calendarWeekStart;
  var today = todayStr();
  var lessons = studentLessons(student.id);
  var byDate = {};
  var noDate = [];
  lessons.forEach(function(l){
    if(!l.dueDate){ noDate.push(l); return; }
    (byDate[l.dueDate] = byDate[l.dueDate] || []).push(l);
  });

  var weekdays = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var days = [];
  for(var i=0;i<7;i++){
    var d = addDaysStr(weekStart, i);
    days.push(d);
  }
  var rangeLabel = fmtDate(days[0])+' – '+fmtDate(days[6]);

  var dayCells = days.map(function(d, i){
    var items = (byDate[d]||[]).slice().sort(function(a,b){ return (a.title||'').localeCompare(b.title||''); });
    var isToday = d===today;
    var isOverdue = d<today && items.some(function(l){ return l.status!=='done'; });
    var chips = items.length ? items.map(function(l){ return renderCalChip(l, student); }).join('') : '<div class="cal-day-empty">Nothing due</div>';
    return '<div class="cal-day'+(isToday?' is-today':'')+(isOverdue?' is-overdue':'')+'">'+
      '<div class="cal-day-head">'+weekdays[i]+' <span class="cal-day-num">'+parseDateStr(d).getDate()+'</span></div>'+
      chips+
    '</div>';
  }).join('');

  var noDateHtml = '';
  if(noDate.length){
    noDateHtml = '<div class="panel" style="margin-top:16px;"><div class="section-head"><h2 style="font-size:16px;">No due date ('+noDate.length+')</h2><div class="hint">Click one to set a date</div></div>'+
      '<div class="cal-nodate-list">'+noDate.map(function(l){
        var subj = getSubject(l.subjectId);
        return '<button class="cal-nodate-row" data-action="calendar-open-lesson" data-id="'+l.id+'" style="text-align:left;">'+
          '<span class="pill">'+esc(subj?subj.name:'?')+'</span><span class="grow">'+esc(l.title||'(untitled)')+'</span>'+
          (l.status==='done'?'<span class="pill">Done</span>':'')+
        '</button>';
      }).join('')+
      '</div></div>';
  }

  return '<div class="section-head"><div><h2>Calendar</h2><div class="hint">'+esc(student.name)+'’s assignments by due date · '+esc(activeYear().label)+'</div></div></div>'+
    '<div class="cal-toolbar">'+
      '<button class="btn btn-sm" data-action="calendar-prev-week">'+icon('chevronLeft')+' Prev</button>'+
      '<button class="btn btn-sm" data-action="calendar-today">Today</button>'+
      '<button class="btn btn-sm" data-action="calendar-next-week">Next '+icon('chevronRight')+'</button>'+
      '<span class="cal-range">'+esc(rangeLabel)+'</span>'+
    '</div>'+
    '<div class="cal-grid">'+dayCells+'</div>'+
    noDateHtml;
}

/* ---------- Attendance ---------- */
// One student + one school year at a time — a July–June, 1–31 grid
// modeled on the NC Division of Non-Public Education's own Home School
// Attendance Record. Doubles as both the entry surface (click a day to
// toggle it) and the printable sheet; the toolbar around it is no-print.
function renderAttendance(){
  var student = getStudent(state.attendanceStudentId) || state.data.students[0];
  var years = sortedYears();
  if(!years.length){
    return '<div class="section-head"><div><h2>Attendance</h2></div></div><p class="helptext">No school years set up yet — add one in Setup.</p>';
  }
  var year = getYear(state.attendanceYearId) || activeYear();
  var sch = state.data.school || {};
  var today = todayStr();

  var yearSelect = '<div class="field" style="max-width:220px;"><label class="field-label">School year</label><select data-action-change="attendance-select-year">'+
    years.map(function(y){ return '<option value="'+y.id+'"'+(y.id===year.id?' selected':'')+'>'+esc(y.label)+'</option>'; }).join('')+
  '</select></div>';

  var tsy = yearTermStartYear(year);
  var total = attendanceCountForYear(student.id, year.id);
  var holidayMode = state.attendanceMode==='holiday';
  // A historical year can skip the day-by-day grid entirely and just carry
  // a typed total (BACKLOG.md "Historical attendance: enter total days
  // instead of the day-by-day grid") — once that total is set, it drives
  // the count above and the grid/mode-toggle/print output all give way to
  // a simple statement. Clearing the total reverts to the grid, whose data
  // (if any was already entered) was never touched.
  var isHistorical = year.mode==='historical';
  var overrideVal = attendanceOverrideDays(student.id, year.id);
  var usingOverride = isHistorical && overrideVal!=null;

  var totalDaysField = isHistorical ? (
    '<div class="field" style="max-width:200px;"><label class="field-label">Total days (skip the grid)</label>'+
    '<input type="number" min="0" step="1" placeholder="e.g. 180" value="'+(overrideVal!=null?overrideVal:'')+
      '" data-action-change="attendance-override-set" data-student="'+student.id+'" data-year="'+year.id+'"></div>'
  ) : '';

  var modeToggle = usingOverride ? '' : (
    '<div class="field"><label class="field-label">Click to mark</label><div>'+
      '<button class="btn btn-sm'+(!holidayMode?' btn-primary':'')+'" data-action="attendance-set-mode" data-mode="instruction">Instruction</button> '+
      '<button class="btn btn-sm'+(holidayMode?' btn-primary':'')+'" data-action="attendance-set-mode" data-mode="holiday">Holiday</button>'+
    '</div></div>'
  );

  // Bulk-mark a whole date range at once, in Mark-instruction mode only
  // (BACKLOG.md "Attendance: bulk-mark a date range instead of one day at
  // a time") — cuts clicking down without changing what the record means;
  // individual days stay toggleable by hand afterward either way.
  var rangeControl = (!usingOverride && !holidayMode) ? (
    '<div class="field"><label class="field-label">Mark a range</label><div style="display:flex;gap:6px;align-items:center;">'+
      '<input type="date" id="att-range-from" style="width:140px;">'+
      '<span class="helptext">to</span>'+
      '<input type="date" id="att-range-to" style="width:140px;">'+
      '<button class="btn btn-sm" data-action="attendance-mark-range" data-student="'+student.id+'" data-year="'+year.id+'">Mark</button>'+
    '</div></div>'
  ) : '';

  var actions = '<div class="no-print" style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px;">'+
    '<div style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;">'+yearSelect+totalDaysField+modeToggle+rangeControl+
      '<div><div class="eyebrow">Days logged</div><div style="font-family:var(--font-mono);font-size:22px;font-weight:600;">'+total+'</div></div>'+
    '</div>'+
    '<button class="btn btn-primary" data-action="report-print">'+icon('printer')+' Print / Save PDF</button>'+
  '</div>';

  var header = '<div class="rc-title-row"><div class="school-name">'+esc(sch.name||'Homeroom')+'</div><div class="rc-tag">Home School Attendance Record · '+esc(year.label)+'</div></div>'+
    '<div class="rc-header">'+
      '<div class="rc-line"><span>Student</span><b>'+esc(student.name)+'</b></div>'+
      '<div class="rc-line"><span>County</span><b>'+esc(sch.county||'—')+'</b></div>'+
      '<div class="rc-line"><span>School Term</span><b>'+tsy+' – '+(tsy+1)+'</b></div>'+
      '<div class="rc-line"><span>Days logged</span><b>'+total+'</b></div>'+
    '</div>';

  var body;
  if(usingOverride){
    body = '<p style="margin:18px 0;">Total days of instruction conducted this school year: <b>'+total+'</b>.</p>'+
      '<p class="helptext">Entered directly as a historical total rather than a day-by-day log.</p>';
  } else {
    var months = yearMonthList(year);
    var monthNames = ['July','August','September','October','November','December','January','February','March','April','May','June'];
    var headCells = '<th class="att-month-label">Month</th>';
    for(var d=1; d<=31; d++) headCells += '<th>'+d+'</th>';
    var bodyRows = months.map(function(ym, mi){
      var dim = daysInMonthOf(ym);
      var cells = '';
      for(var d=1; d<=31; d++){
        if(d>dim){
          cells += '<td class="att-na"></td>';
          continue;
        }
        var dateStr = ym+'-'+String(d).padStart(2,'0');
        var dow = parseDateStr(dateStr).getDay(); // 0=Sun..6=Sat
        var isWeekend = dow===0 || dow===6;
        var holiday = isHoliday(year.id, dateStr);
        var checked = !holiday && isAttendanceDay(student.id, year.id, dateStr);
        var cls = 'att-day' + (isWeekend?' att-weekend':'') + (holiday?' att-holiday':'') + (checked?' att-checked':'') + (dateStr===today?' att-today':'');
        var attrs = '';
        if(!isWeekend){
          attrs = holidayMode
            ? ' data-action="attendance-toggle-holiday" data-year="'+year.id+'" data-date="'+dateStr+'"'
            : (holiday ? '' : ' data-action="attendance-toggle-day" data-student="'+student.id+'" data-year="'+year.id+'" data-date="'+dateStr+'"');
        }
        cells += '<td class="'+cls+'" title="'+esc(fmtDate(dateStr))+'"'+attrs+'>'+(holiday?'H':(checked?'✓':''))+'</td>';
      }
      return '<tr><td class="att-month-label">'+monthNames[mi]+'</td>'+cells+'</tr>';
    }).join('');
    body = '<div class="table-scroll"><table class="report-table att-table"><thead><tr>'+headCells+'</tr></thead><tbody>'+bodyRows+'</tbody></table></div>'+
      '<p class="helptext no-print" style="margin-top:10px;">Tip: choose Landscape in the print dialog for the best fit.</p>';
  }

  var hint;
  if(!isHistorical){
    hint = 'Check off each day '+esc(student.name)+'’s instruction was conducted — weekends are greyed out · switch to Holiday to mark breaks (H), shared across all students · click a cell to toggle, or use Mark a range to check off a whole span at once';
  } else if(usingOverride){
    hint = 'Historical year — total days recorded directly above. Clear it to switch back to checking off individual days.';
  } else {
    hint = 'Historical year — type a total instructional-days number above instead of checking off each day, or leave it blank and use the day-by-day grid below (Mark a range checks off a whole span at once) as usual.';
  }

  return '<div class="section-head"><div><h2>Attendance</h2><div class="hint">'+hint+'</div></div></div>'+
    actions+
    '<div class="panel">'+header+body+
      '<div style="margin-top:22px;border-top:1px solid var(--rule);padding-top:14px;">By my signature below, I affirm that the above entered information, to the best of my knowledge, is accurate and truthful.<br><br>Chief Administrator’s Signature: ______________________________________ &nbsp;&nbsp; Date: ____________</div>'+
    '</div>';
}

/* ---------- Grades ---------- */
function renderInlineEditRow(l, subs){
  return '<div class="inline-edit" style="border-top:none;padding-top:0;">'+
    '<div class="field-row">'+
      '<div class="field"><label class="field-label">Title</label><input type="text" id="edit-title-'+l.id+'" value="'+esc(l.title)+'"></div>'+
      '<div class="field"><label class="field-label">Possible</label><input type="number" step="any" id="edit-possible-'+l.id+'" value="'+(l.possible!=null?l.possible:'')+'"></div>'+
      '<div class="field"><label class="field-label">Actual</label><input type="number" step="any" id="edit-actual-'+l.id+'" value="'+(l.actual!=null?l.actual:'')+'"></div>'+
    '</div>'+
    '<div class="btn-row"><button class="btn" data-action="lesson-edit-toggle" data-id="'+l.id+'">Cancel</button><button class="btn btn-primary" data-action="lesson-save-edit" data-id="'+l.id+'">Save</button></div>'+
  '</div>';
}

function renderGrades(){
  var student = getStudent(state.activeStudentId);
  if(!student) return renderNoStudentsEmpty();
  var subs = studentSubjects(student.id);
  if(!subs.length){
    return '<div class="empty-state"><h3>No subjects yet</h3><p>Add subjects for '+esc(student.name)+' in Setup before recording grades.</p><button class="btn btn-primary" data-action="switch-view" data-view="setup">'+icon('plus')+' Go to Setup</button></div>';
  }
  var quarters = yearQuarters(state.data.activeYearId);
  var reviewQueue = studentLessons(student.id).filter(function(l){ return l.status==='review'; });
  var ungraded = studentLessons(student.id).filter(function(l){ return l.status!=='done'; });

  var reviewHtml = '';
  if(reviewQueue.length){
    reviewHtml = '<div class="panel" style="margin-bottom:16px;"><div class="section-head"><h2 style="font-size:16px;">Needs your review ('+reviewQueue.length+')</h2></div>'+
      '<div class="card-stack">'+reviewQueue.map(function(l){ return renderLessonCard(l, student, subs); }).join('')+'</div></div>';
  }

  var modeNew = state.gradesMode!=='existing';
  var lessonSelectOptions = '<option value="">Choose an assignment\u2026</option>' + ungraded.map(function(l){
    var subj = getSubject(l.subjectId);
    return '<option value="'+l.id+'"'+(state.gradesSelectedLessonId===l.id?' selected':'')+'>'+esc(subj?subj.name:'?')+' \u2014 '+esc(l.title)+'</option>';
  }).join('');
  var selectedLesson = state.gradesSelectedLessonId ? state.data.lessons.find(function(l){return l.id===state.gradesSelectedLessonId;}) : null;

  var formHtml = '<div class="panel" style="margin-bottom:16px;">'+
    '<div class="section-head"><h2 style="font-size:16px;">Record a grade</h2>'+
      '<div style="display:flex;gap:4px;">'+
        '<button class="btn btn-sm'+(modeNew?' btn-primary':'')+'" data-action="grades-mode" data-mode="new">New assignment</button>'+
        '<button class="btn btn-sm'+(!modeNew?' btn-primary':'')+'" data-action="grades-mode" data-mode="existing">Existing lesson'+(ungraded.length?' ('+ungraded.length+')':'')+'</button>'+
      '</div></div>';

  if(modeNew){
    formHtml += '<div class="field-row">'+
      '<div class="field"><label class="field-label">Subject</label><select id="gr-subject">'+subs.map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+'</option>';}).join('')+'</select></div>'+
      '<div class="field"><label class="field-label">Quarter</label><select id="gr-quarter">'+quarters.map(function(q){return '<option value="'+q.id+'">'+esc(q.name)+'</option>';}).join('')+'</select></div>'+
      '<div class="field"><label class="field-label">Assignment title</label><input type="text" id="gr-title" placeholder="e.g. Week 6 Q1"></div>'+
    '</div>'+
    '<div class="field-row">'+
      '<div class="field"><label class="field-label">Possible points</label><input type="number" step="any" id="gr-possible"></div>'+
      '<div class="field"><label class="field-label">Actual points</label><input type="number" step="any" id="gr-actual"></div>'+
    '</div>'+
    '<div style="display:flex;justify-content:flex-end;"><button class="btn btn-primary" data-action="grades-submit-new">'+icon('check')+' Save grade</button></div>';
  } else {
    formHtml += '<div class="field"><label class="field-label">Assignment</label><select id="gr-existing-select" data-action-change="grades-select-lesson">'+lessonSelectOptions+'</select></div>';
    if(selectedLesson){
      formHtml += '<div class="field-row">'+
        '<div class="field"><label class="field-label">Possible points</label><input type="number" step="any" id="gr-ex-possible" value="'+(selectedLesson.possible!=null?selectedLesson.possible:'')+'"></div>'+
        '<div class="field"><label class="field-label">Actual points</label><input type="number" step="any" id="gr-ex-actual" value="'+(selectedLesson.actual!=null?selectedLesson.actual:'')+'"></div>'+
      '</div>'+
      '<div style="display:flex;gap:8px;justify-content:flex-end;"><button class="btn" data-action="grades-cancel-existing">Cancel</button><button class="btn btn-primary" data-action="grades-submit-existing" data-id="'+selectedLesson.id+'">'+icon('check')+' Save &amp; send to review</button></div>';
    } else if(ungraded.length===0){
      formHtml += '<p class="helptext">Everything for '+esc(student.name)+' is already graded. Add a new assignment above, or plan more lessons in the Planner.</p>';
    }
  }
  formHtml += '</div>';

  var recent = studentLessons(student.id).filter(function(l){return l.status==='done' && l.actual!=null;})
    .slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); }).slice(0,8);

  var recentHtml = '<div class="panel"><div class="section-head"><h2 style="font-size:16px;">Recently graded</h2></div>';
  if(!recent.length){
    recentHtml += '<p class="helptext">Nothing graded yet.</p>';
  } else {
    recentHtml += '<div class="table-scroll"><table class="report-table"><thead><tr><th style="text-align:left;">Subject</th><th style="text-align:left;">Assignment</th><th>Quarter</th><th>Score</th><th>%</th><th>Grade</th><th></th></tr></thead><tbody>';
    recent.forEach(function(l){
      var subj = getSubject(l.subjectId);
      var q = getQuarter(l.quarterId);
      var pct = Number(l.possible)>0 ? Number(l.actual)/Number(l.possible)*100 : 0;
      var band = letterBand(pct, state.data.scale);
      recentHtml += '<tr><td style="text-align:left;">'+esc(subj?subj.name:'?')+'</td><td style="text-align:left;">'+esc(l.title)+'</td><td>'+esc(q?q.name:'?')+'</td>'+
        '<td class="num">'+l.actual+' / '+l.possible+'</td><td class="num">'+fmtPct(pct)+'</td>'+
        '<td><span class="grade-badge '+letterClass(band?band.letter:null)+'">'+esc(band?band.letter:'')+'</span></td>'+
        '<td><div style="display:flex;gap:2px;justify-content:flex-end;"><button class="icon-btn" title="Edit" data-action="lesson-edit-toggle" data-id="'+l.id+'">'+icon('pencil')+'</button>'+renderDeleteIconBtn('lesson:'+l.id)+'</div></td></tr>';
      if(state.editingLessonId===l.id){
        recentHtml += '<tr><td colspan="7">'+renderInlineEditRow(l, subs)+'</td></tr>';
      }
    });
    recentHtml += '</tbody></table></div>';
  }
  recentHtml += '</div>';

  return '<div class="section-head"><div><h2>Grades</h2><div class="hint">Record scores for '+esc(student.name)+' \u2014 saving here sends it to Review, not straight to Done</div></div></div>'+
    reviewHtml + formHtml + recentHtml;
}

/* ---------- Reports (quarterly progress card, active year) ---------- */
function renderReports(){
  var student = getStudent(state.reportStudentId || state.activeStudentId);
  if(!student) return renderNoStudentsEmpty();
  var allSubs = studentSubjects(student.id);
  var subs = reportSubjectsFor(student.id);
  if(!subs.length){
    return '<div class="section-head"><div><h2>Progress / Report Card</h2><div class="hint">Each quarter pools actual/possible points · cumulative averages the completed quarters</div></div></div>'+
      '<div class="empty-state"><h3>No graded work yet</h3><p>'+esc(student.name)+'’s report card only lists subjects with graded, completed lessons — nothing qualifies yet this year.</p>'+
      (allSubs.length ? '<button class="btn btn-primary" data-action="switch-view" data-view="grades">'+icon('book')+' Go to Grades</button>' : '<button class="btn btn-primary" data-action="switch-view" data-view="setup">'+icon('plus')+' Go to Setup</button>')+
      '</div>';
  }
  var quarters = yearQuarters(state.data.activeYearId);
  var sch = state.data.school || {};

  var header = '<div class="rc-title-row"><div class="school-name">'+esc(sch.name||'Homeroom')+'</div><div class="rc-tag">'+esc(sch.authority||'')+' \u00b7 Progress / Report Card \u00b7 '+esc(activeYear().label)+'</div></div>'+
    '<div class="rc-header">'+
      '<div class="rc-line"><span>Administrator</span><b>'+esc(sch.administrator||'\u2014')+'</b></div>'+
      '<div class="rc-line"><span>Student</span><b>'+esc(student.name)+'</b></div>'+
      '<div class="rc-line"><span>County</span><b>'+esc(sch.county||'\u2014')+'</b></div>'+
      '<div class="rc-line"><span>Grade</span><b>'+esc(gradeLabelFor(student.id, state.data.activeYearId)||'\u2014')+'</b></div>'+
      '<div class="rc-line"><span>School ID</span><b>'+esc(sch.schoolId||'\u2014')+'</b></div>'+
      '<div class="rc-line"><span>Date</span><b>'+fmtDate(todayStr())+'</b></div>'+
      '<div class="rc-line"><span>Address</span><b>'+esc(sch.address||'\u2014')+'</b></div>'+
      '<div class="rc-line"><span>Phone</span><b>'+esc(sch.phone||'\u2014')+'</b></div>'+
      '<div class="rc-line"><span>Principal</span><b>'+esc(sch.principal||'\u2014')+'</b></div>'+
    '</div>';

  var theadRow1 = '<tr><th rowspan="2">Course</th>';
  quarters.forEach(function(q){ theadRow1 += '<th colspan="2">'+esc(q.name)+'</th>'; });
  theadRow1 += '<th colspan="2">Cumulative</th><th rowspan="2">GPA</th></tr>';
  var theadRow2 = '<tr>';
  quarters.forEach(function(){ theadRow2 += '<th>%</th><th>Grade</th>'; });
  theadRow2 += '<th>%</th><th>Grade</th></tr>';

  var gpaSum=0, gpaCount=0;
  var bodyRows = subs.map(function(su){
    var cells='';
    quarters.forEach(function(q){
      var agg = quarterAggregate(student.id, su.id, q.id);
      if(agg){
        cells += '<td class="num">'+fmtPct(agg.pct)+'</td><td><span class="grade-badge '+letterClass(agg.letter)+'">'+esc(agg.letter)+'</span></td>';
      } else {
        cells += '<td class="num grade-none">\u2014</td><td class="grade-none">\u2014</td>';
      }
    });
    var cum = cumulativeAggregate(student.id, su.id);
    if(cum){
      cells += '<td class="num">'+fmtPct(cum.pct)+'</td><td><span class="grade-badge '+letterClass(cum.letter)+'">'+esc(cum.letter)+'</span></td><td class="num">'+(cum.gpa!=null?cum.gpa.toFixed(1):'\u2014')+'</td>';
      if(cum.gpa!=null){ gpaSum+=cum.gpa; gpaCount++; }
    } else {
      cells += '<td class="num grade-none">\u2014</td><td class="grade-none">\u2014</td><td class="num grade-none">\u2014</td>';
    }
    var doneCount = studentLessons(student.id).filter(function(l){return l.subjectId===su.id && l.status==='done';}).length;
    var target = su.targetTotal ? (' <span class="helptext" style="font-family:var(--font-body);">('+doneCount+' of '+su.targetTotal+' '+(su.unitLabel||'item').toLowerCase()+'s logged)</span>') : '';
    return '<tr><td class="course-cell">'+esc(su.name)+target+'</td>'+cells+'</tr>';
  }).join('');

  var overallGpa = gpaCount ? (gpaSum/gpaCount) : null;

  var legend = '<div class="legend-grid">'+state.data.scale.slice().sort(function(a,b){return b.min-a.min;}).map(function(b){
    return '<span><b>'+esc(b.letter)+'</b> \u2265 '+b.min+'%</span>';
  }).join('')+'</div>';

  var table = '<div class="table-scroll"><table class="report-table"><thead>'+theadRow1+theadRow2+'</thead><tbody>'+bodyRows+'</tbody></table></div>';

  var actions = '<div class="no-print" style="display:flex;gap:8px;justify-content:flex-end;margin-bottom:14px;">'+
    '<button class="btn" data-action="report-export-csv" data-id="'+student.id+'">'+icon('download')+' Export CSV</button>'+
    '<button class="btn btn-primary" data-action="report-print">'+icon('printer')+' Print / Save PDF</button>'+
  '</div>';

  return '<div class="section-head"><div><h2>Progress / Report Card</h2><div class="hint">Each quarter pools actual/possible points \u00b7 cumulative averages the completed quarters</div></div></div>'+
    actions+
    '<div class="panel rc-report">'+header+table+
      (overallGpa!=null ? '<p style="margin-top:14px;font-weight:600;">Overall GPA: <span class="grade-badge" style="background:var(--pine-soft);color:var(--pine-text);">'+overallGpa.toFixed(2)+'</span></p>' : '')+
      '<div class="rc-signature">Principal\u2019s Signature: ______________________________________</div>'+
      legend+
    '</div>';
}

function renderTranscript(){
  if(!state.data.students.length) return renderNoStudentsEmpty();
  var student = getStudent(state.transcriptStudentId) || state.data.students[0];
  var sch = state.data.school || {};
  // Only years this student is actually enrolled in (has a studentYearInfo
  // record for) — e.g. a graduated student shouldn't get a blank block for
  // a year after they left, same fix as the Dashboard's per-year filtering.
  var enrolledYears = sortedYears().filter(function(y){ return !!getStudentYearInfo(student.id, y.id); });
  // This is a *high school* transcript — scoped to 9th-12th grade years
  // only (BACKLOG.md "Official high-school transcript redesign" item 3,
  // 2026-08-28). Elementary/middle years no longer appear here at all
  // (previously shown single-column); a student with no HS years yet
  // gets an empty-state message below instead of being hidden from the
  // student picker entirely, same treatment as "not enrolled yet".
  var years = enrolledYears.filter(function(y){ return hsGradeNumber(gradeLabelFor(student.id, y.id))!=null; });
  // A year with no grade level typed in at all is ambiguous, not
  // recognizably non-HS (unlike one explicitly labeled e.g. "6th
  // Grade") — silently dropping it would hide it from an official
  // document for no visible reason. Flagged instead, below, rather than
  // excluded like a genuinely non-HS year.
  var needsGradeLevelYears = enrolledYears.filter(function(y){
    var label = gradeLabelFor(student.id, y.id);
    return !label || !String(label).trim();
  });
  var needsGradeLevelNote = needsGradeLevelYears.length
    ? '<p class="helptext no-print" style="margin-top:14px;">Not shown here (no grade level set, so Homeroom can’t tell if it’s 9th-12th): '+
      needsGradeLevelYears.map(function(y){return esc(y.label);}).join(', ')+
      '. Add a grade level in Setup → Years to include '+(needsGradeLevelYears.length>1?'them':'it')+'.</p>'
    : '';

  // Student's own address (BACKLOG.md "Student demographics") prints as one
  // or two lines depending on what's filled in, rather than a separate row
  // with an empty label for the second line.
  var studentAddrLines = [];
  if(student.streetAddress) studentAddrLines.push(esc(student.streetAddress));
  if(student.cityStateZip) studentAddrLines.push(esc(student.cityStateZip));
  var studentAddrHtml = studentAddrLines.length ? studentAddrLines.join('<br>') : '\u2014';

  // School caption line (address + registration ID) \u2014 signals "real,
  // registered school" for a homeschool transcript, without a full
  // labeled School Information block: the administrator's name is
  // already on the signature block below, and a phone number isn't
  // worth a whole block here. See BACKLOG.md "Official high-school
  // transcript redesign" item 2.
  var schoolCaptionParts = [];
  if(sch.address) schoolCaptionParts.push(esc(sch.address));
  if(sch.schoolId) schoolCaptionParts.push('School ID #'+esc(sch.schoolId));
  var schoolCaption = schoolCaptionParts.join(' \u00b7 ');

  // The date line shows the actual graduation date once set; until then it
  // shows the expected graduation date (or an em-dash if neither is filled
  // in yet) \u2014 this is what "Date issued" used to show (today's date),
  // replaced per the same BACKLOG.md item.
  var gradLabel, gradValue;
  if(student.graduationDate){ gradLabel = 'Graduation date'; gradValue = fmtDate(student.graduationDate); }
  else { gradLabel = 'Expected graduation'; gradValue = student.expectedGraduationDate ? fmtDate(student.expectedGraduationDate) : '\u2014'; }

  var header = '<div class="rc-title-row">'+
      '<div class="school-name">'+esc(sch.name||'Homeroom')+'</div>'+
      '<div class="rc-tag">High School Transcript</div>'+
      (schoolCaption ? '<p class="helptext" style="margin:4px 0 0 0;">'+schoolCaption+'</p>' : '')+
      '<p class="helptext" style="margin:6px 0 0 0;">'+gradLabel+': '+gradValue+'</p>'+
    '</div>'+
    '<div style="margin-top:18px;">'+
      '<div class="eyebrow">Student Information</div>'+
      '<div class="rc-header">'+
        '<div class="rc-line"><span>Name</span><b>'+esc(student.name)+'</b></div>'+
        '<div class="rc-line"><span>Date of birth</span><b>'+(student.dob?fmtDate(student.dob):'\u2014')+'</b></div>'+
        '<div class="rc-line"><span>Sex</span><b>'+esc(student.sex||'\u2014')+'</b></div>'+
        '<div class="rc-line"><span>Phone</span><b>'+esc(student.phone||'\u2014')+'</b></div>'+
        '<div class="rc-line" style="grid-column:1 / -1;"><span>Address</span><b>'+studentAddrHtml+'</b></div>'+
      '</div>'+
    '</div>';

  if(!years.length){
    var emptyMsg;
    if(!sortedYears().length) emptyMsg = 'No school years set up yet \u2014 add one in Setup.';
    else if(!enrolledYears.length) emptyMsg = esc(student.name)+' isn\u2019t enrolled in any school year yet \u2014 add one in Setup \u2192 Years.';
    else emptyMsg = 'No high school years yet \u2014 '+esc(student.name)+'\u2019s Transcript will show 9th-12th grade years once one is set up in Setup \u2192 Years.';
    return '<div class="section-head"><div><h2>Transcript</h2></div></div><div class="panel">'+header+'<p class="helptext" style="margin-top:14px;">'+emptyMsg+'</p>'+needsGradeLevelNote+'</div>';
  }

  var allGpas = [], allCredits = 0;
  var yearItems = years.map(function(y){
    var gradeLabel = gradeLabelFor(student.id, y.id);
    var rows, sumCredit=0, pcts=[], gpas=[];
    if(y.mode==='tracked'){
      var subsY = studentSubjectsForYear(student.id, y.id);
      rows = subsY.map(function(su){
        var cum = cumulativeAggregate(student.id, su.id);
        var credit = su.creditHours!=null ? su.creditHours : 1;
        sumCredit += credit;
        if(cum){ pcts.push(cum.pct); if(cum.gpa!=null) gpas.push(cum.gpa); }
        return '<tr><td style="text-align:left;">'+esc(su.category||'')+'</td><td class="course-cell">'+esc(su.name)+'</td>'+
          '<td class="num">'+(cum&&cum.letter?esc(cum.letter):'\u2014')+'</td>'+
          '<td class="num">'+(cum?fmtPct(cum.pct):'\u2014')+'</td>'+
          '<td class="num">'+credit+'</td>'+
          '<td class="num">'+(cum&&cum.gpa!=null?cum.gpa.toFixed(1):'\u2014')+'</td></tr>';
      }).join('');
      if(!subsY.length) rows = '<tr><td colspan="6" class="helptext" style="text-align:left;">No courses recorded for this year yet.</td></tr>';
    } else {
      var hist = state.data.historicalCourses.filter(function(h){return h.studentId===student.id && h.yearId===y.id;});
      rows = hist.map(function(h){
        var band = letterBand(h.gradePct, state.data.scale);
        sumCredit += (h.credit||0);
        pcts.push(h.gradePct); if(band){ gpas.push(band.gpa); }
        var r = '<tr><td style="text-align:left;">'+esc(h.type||'')+'</td><td class="course-cell">'+esc(h.title)+'</td>'+
          '<td class="num">'+(band?esc(band.letter):'\u2014')+'</td>'+
          '<td class="num">'+fmtPct(h.gradePct)+'</td><td class="num">'+h.credit+'</td><td class="num">'+(band?band.gpa.toFixed(1):'\u2014')+'</td>'+
          '<td class="no-print"><div style="display:flex;gap:2px;"><button class="icon-btn" title="Edit" data-action="hist-edit-toggle" data-id="'+h.id+'">'+icon('pencil')+'</button>'+renderDeleteIconBtn('hist:'+h.id)+'</div></td></tr>';
        if(state.editingHistRowId===h.id) r += '<tr class="no-print"><td colspan="7">'+renderHistEditRow(h)+'</td></tr>';
        return r;
      }).join('');
      if(!hist.length) rows = '<tr><td colspan="7" class="helptext" style="text-align:left;">No courses added for this year yet.</td></tr>';
    }
    allCredits += sumCredit;
    allGpas = allGpas.concat(gpas);
    var avgPct = pcts.length? pcts.reduce(function(a,b){return a+b;},0)/pcts.length : null;
    var avgGpa = gpas.length? gpas.reduce(function(a,b){return a+b;},0)/gpas.length : null;

    var addHistRow = '';
    if(y.mode==='historical'){
      if(state.addingHistYearFor===y.id){
        addHistRow = renderHistAddForm(y, student.id);
      } else if(state.histImportYearFor===y.id){
        addHistRow = renderHistImportPanel(y, student.id);
      } else {
        addHistRow = '<div class="no-print" style="display:flex;gap:8px;margin-top:8px;">'+
          '<button class="btn btn-sm" data-action="hist-add-open" data-year="'+y.id+'">'+icon('plus')+' Add course</button>'+
          '<button class="btn btn-sm" data-action="hist-import-toggle" data-year="'+y.id+'">'+icon('upload')+' Bulk import</button>'+
        '</div>';
      }
    }

    var html = '<div class="transcript-year-block">'+
      '<div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:6px;flex-wrap:wrap;gap:6px;">'+
        '<h3 style="font-size:16px;">'+esc(y.label)+(gradeLabel?' \u2014 '+esc(gradeLabel):'')+'</h3>'+
        '<span class="pill no-print">'+(y.mode==='tracked'?'Tracked live':'Historical entry')+'</span>'+
      '</div>'+
      '<div class="table-scroll"><table class="report-table"><thead><tr><th style="text-align:left;">Type</th><th style="text-align:left;">Course</th><th colspan="2">Grade</th><th>Credit</th><th>GPA</th>'+(y.mode==='historical'?'<th class="no-print"></th>':'')+'</tr></thead><tbody>'+rows+
        '<tr style="font-weight:700;background:var(--well);"><td colspan="2" style="text-align:left;">Totals / Averages</td><td class="num"></td><td class="num">'+(avgPct!=null?fmtPct(avgPct):'\u2014')+'</td><td class="num">'+sumCredit+'</td><td class="num">'+(avgGpa!=null?avgGpa.toFixed(2):'\u2014')+'</td>'+(y.mode==='historical'?'<td class="no-print"></td>':'')+'</tr>'+
      '</tbody></table></div>'+
      addHistRow+
    '</div>';
    return {html:html, isHS: hsGradeNumber(gradeLabel)!=null};
  });

  // Two-column pairing: consecutive high-school-recognized years (9th-12th)
  // pair up two-per-row, matching the reference transcript template
  // (Freshman+Sophomore, Junior+Senior). Everything else \u2014 elementary/
  // middle years, or an odd leftover HS year \u2014 stays a single full-width
  // block, in its original chronological position.
  var yearBlocks = '';
  for(var yi=0; yi<yearItems.length; yi++){
    var cur = yearItems[yi], next = yearItems[yi+1];
    if(cur.isHS && next && next.isHS){
      yearBlocks += '<div class="transcript-pair-row">'+cur.html+next.html+'</div>';
      yi++;
    } else {
      yearBlocks += cur.html;
    }
  }
  yearBlocks += needsGradeLevelNote;

  var cumGpa = allGpas.length ? allGpas.reduce(function(a,b){return a+b;},0)/allGpas.length : null;

  var scaleLegend = '<div class="legend-grid" style="margin-top:6px;">'+state.data.scale.slice().sort(function(a,b){return b.min-a.min;}).map(function(b){
    return '<span><b>'+esc(b.letter)+'</b> \u2265 '+b.min+'%</span>';
  }).join('')+'</div>';

  // Academic Record Summary \u2014 Diploma Earned + per-year Attendance on the
  // left, Total Credits + Cumulative GPA on the right. Graduation Date is
  // deliberately not repeated here \u2014 it's already on the header (item 2)
  // and showing it twice would be redundant (confirmed 2026-08-28).
  // Attendance is a day-count only (no present/absent split): the
  // underlying data just tracks whether a day was logged, nothing else.
  var attendanceLines = years.map(function(y){
    var days = attendanceCountForYear(student.id, y.id);
    return '<div class="rc-line"><span>'+esc(gradeLabelFor(student.id, y.id))+'</span><b>'+days+' day'+(days===1?'':'s')+'</b></div>';
  }).join('');

  var summary = '<div class="rc-avoid-break" style="margin-top:26px;">'+
    '<div class="eyebrow">Academic Record Summary</div>'+
    '<div style="display:flex;gap:40px;flex-wrap:wrap;align-items:flex-start;margin-top:8px;">'+
      '<div style="min-width:220px;">'+
        '<div class="rc-header" style="grid-template-columns:1fr;margin-bottom:0;">'+
          '<div class="rc-line"><span>Diploma earned</span><b>'+esc(student.diplomaEarned||'\u2014')+'</b></div>'+
        '</div>'+
        '<div class="helptext" style="margin:10px 0 2px 0;">Attendance</div>'+
        '<div class="rc-header" style="grid-template-columns:1fr;margin-bottom:0;">'+attendanceLines+'</div>'+
      '</div>'+
      '<div style="display:flex;gap:24px;flex-wrap:wrap;">'+
        '<div><div class="eyebrow">Total credits</div><div style="font-family:var(--font-mono);font-size:22px;font-weight:600;">'+allCredits+'</div></div>'+
        '<div><div class="eyebrow">Cumulative GPA</div><div style="font-family:var(--font-mono);font-size:22px;font-weight:600;">'+(cumGpa!=null?cumGpa.toFixed(2):'\u2014')+'</div></div>'+
      '</div>'+
    '</div>'+
  '</div>';

  // Additional Student Information — three free-text columns, rendered
  // only when the student has at least one filled in (BACKLOG.md's
  // "cross-cutting principle": presence-of-data drives visibility rather
  // than a manual per-section toggle, same as Test Scores and Previous
  // Schools below). Newlines become <br> since these are meant to read
  // as short multi-line lists, not single sentences.
  function nl2br(text){ return esc(text).replace(/\n/g,'<br>'); }
  var addlInfoFields = [
    {label:'Interests & Abilities', value:student.interestsAbilities},
    {label:'Achievements', value:student.achievements},
    {label:'Volunteer & Extracurricular', value:student.volunteerExtracurricular}
  ];
  var addlInfoSection = addlInfoFields.some(function(f){ return f.value && f.value.trim(); })
    ? '<div class="rc-avoid-break" style="margin-top:26px;">'+
        '<div class="eyebrow">Additional Student Information</div>'+
        '<div style="display:flex;gap:24px;flex-wrap:wrap;margin-top:8px;">'+
          addlInfoFields.map(function(f){
            return '<div style="flex:1 1 200px;">'+
              '<div class="helptext" style="margin-bottom:4px;">'+esc(f.label)+'</div>'+
              '<div style="font-size:13px;">'+(f.value && f.value.trim() ? nl2br(f.value) : '—')+'</div>'+
            '</div>';
          }).join('')+
        '</div>'+
      '</div>'
    : '';

  var testScoresSection = renderTestScoresSection(student);
  var prevSchoolsSection = renderPrevSchoolsSection(student);

  var scaleSection = '<div style="margin-top:20px;">'+
    '<div class="eyebrow">Grading scale</div>'+
    scaleLegend+
  '</div>';

  var signatures = '<div class="transcript-signatures">'+
    '<div><div class="rc-sig-name">'+(sch.principal?esc(sch.principal):'\u2014')+'</div><div class="rc-sig-line">Principal Signature</div></div>'+
    '<div><div class="rc-sig-name">'+(sch.administrator?esc(sch.administrator):'\u2014')+'</div><div class="rc-sig-line">Administrator Signature</div></div>'+
  '</div>';

  var actions = '<div class="no-print" style="display:flex;gap:8px;justify-content:flex-end;margin-bottom:14px;">'+
    '<button class="btn btn-primary" data-action="report-print">'+icon('printer')+' Print / Save PDF</button>'+
  '</div>';

  return '<div class="section-head"><div><h2>Transcript</h2><div class="hint">Every school year in one record \u2014 tracked years pull live, earlier years you can fill in by hand</div></div></div>'+
    actions+
    '<div class="panel rc-transcript">'+header+yearBlocks+summary+addlInfoSection+testScoresSection+prevSchoolsSection+scaleSection+signatures+
    '</div>';
}

/* ---------- Diploma ---------- */
function renderDiploma(){
  if(!state.data.students.length) return renderNoStudentsEmpty();
  var student = getStudent(state.diplomaStudentId) || state.data.students[0];
  var sch = state.data.school || {};

  // Same "flag, don't block" treatment the Transcript uses for incomplete
  // data \u2014 visible on-screen so it's obvious what's missing, never printed.
  var readinessNotes = [];
  if(!student.graduationDate) readinessNotes.push('No graduation date set for '+esc(student.name)+' \u2014 the date line below will show an em dash until one is added in Setup \u2192 Students \u2192 Details.');
  if(student.diplomaEarned!=='Yes') readinessNotes.push('Diploma Earned isn\u2019t marked \u201cYes\u201d yet for '+esc(student.name)+' in Setup \u2192 Students \u2192 Details \u2014 this is a preview of what the diploma will look like, not a signal it\u2019s ready to print.');
  var readinessNote = readinessNotes.length
    ? '<p class="helptext no-print" style="margin-top:14px;">'+readinessNotes.join(' ')+'</p>'
    : '';

  var dateLine = student.graduationDate
    ? 'Given this '+esc(fmtDateSpelledOut(student.graduationDate))
    : 'Given this \u2014';

  var schoolName = sch.name || 'Homeroom';
  var body = '<div class="panel diploma-frame">'+
      '<div class="diploma-school-name">'+esc(schoolName)+'</div>'+
      '<div class="diploma-subtitle">This Certifies That</div>'+
      '<div class="diploma-student-name">'+esc(student.name||'')+'</div>'+
      '<div class="diploma-body">has successfully completed the necessary required course of study prescribed for graduation by '+esc(schoolName)+' in accordance with the regulations of the state of North Carolina Division of Non-Public Education and is therefore awarded this</div>'+
      '<div class="diploma-award">High School Diploma</div>'+
      '<div class="diploma-date">'+dateLine+'</div>'+
      '<div class="diploma-signatures">'+
        '<div><div class="rc-sig-name">'+(sch.principal?esc(sch.principal):'\u2014')+'</div><div class="rc-sig-line">Principal Signature</div></div>'+
        '<div><div class="rc-sig-name">'+(sch.administrator?esc(sch.administrator):'\u2014')+'</div><div class="rc-sig-line">Administrator Signature</div></div>'+
      '</div>'+
    '</div>';

  var actions = '<div class="no-print" style="display:flex;gap:8px;justify-content:flex-end;margin-bottom:14px;">'+
    '<button class="btn btn-primary" data-action="report-print">'+icon('printer')+' Print / Save PDF</button>'+
  '</div>';

  return '<div class="section-head"><div><h2>Diploma</h2><div class="hint">A printable diploma for a graduating student</div></div></div>'+
    actions+readinessNote+body;
}

/* ---------- Setup ---------- */
function renderSetup(){
  var tabs = [
    {id:'years', label:'Years'},
    {id:'students', label:'Students'},
    {id:'subjects', label:'Subjects'},
    {id:'quarters', label:'Quarters'},
    {id:'scale', label:'Grading scale'},
    {id:'school', label:'School info'},
    {id:'data', label:'Data'}
  ];
  var tabBtns = tabs.map(function(t){
    return '<button class="setup-tab-btn'+(state.setupTab===t.id?' active':'')+'" data-action="setup-tab" data-tab="'+t.id+'">'+t.label+'</button>';
  }).join('');
  var body = '';
  if(state.setupTab==='years') body = renderSetupYears();
  else if(state.setupTab==='students') body = renderSetupStudents();
  else if(state.setupTab==='quarters') body = renderSetupQuarters();
  else if(state.setupTab==='subjects') body = renderSetupSubjects();
  else if(state.setupTab==='scale') body = renderSetupScale();
  else if(state.setupTab==='school') body = renderSetupSchool();
  else if(state.setupTab==='data') body = renderSetupData();

  return '<div class="section-head"><div><h2>Setup</h2><div class="hint">Years, students, subjects, and how grades are scored</div></div></div>'+
    '<div class="setup-tabs">'+tabBtns+'</div>'+
    '<div class="panel">'+body+'</div>';
}

function bindAttrs(coll, id, field){
  return 'data-bind-collection="'+coll+'" data-bind-id="'+esc(id)+'" data-bind-field="'+field+'"';
}

function renderSetupYears(){
  var years = sortedYears();
  var rows = years.map(function(y){
    var isActive = y.id===state.data.activeYearId;
    return '<div class="row-item">'+
      '<input type="text" class="grow" value="'+esc(y.label)+'" style="max-width:160px;" '+bindAttrs('years',y.id,'label')+'>'+
      '<span class="pill">'+(y.mode==='tracked'?'Tracked':'Historical')+'</span>'+
      (isActive ? '<span class="pill" style="background:var(--pine-soft);color:var(--pine-text);">Active</span>' : '<button class="btn btn-sm" data-action="year-set-active" data-id="'+y.id+'">Set active</button>')+
      renderDeleteIconBtn('year:'+y.id)+
    '</div>';
  }).join('');

  var studentGradeRows = '';
  if(state.data.students.length){
    studentGradeRows = '<div class="eyebrow" style="margin-top:18px;">Grade level per student, for the active year ('+esc(activeYear().label)+')</div>'+
      state.data.students.map(function(s){
        var val = gradeLabelFor(s.id, state.data.activeYearId);
        return '<div class="row-item"><span class="grow">'+esc(s.name)+'</span>'+
          '<input type="text" value="'+esc(val)+'" placeholder="e.g. 11th Grade" style="max-width:160px;" '+bindAttrs('studentYear',s.id,'gradeLabel')+'></div>';
      }).join('');
  }

  var addForm = state.addingYear ? (
    '<div class="panel" style="margin-top:14px;">'+
      '<div class="field-row">'+
        '<div class="field"><label class="field-label">Year label</label><input type="text" id="new-year-label" placeholder="e.g. 2026-2027"></div>'+
        '<div class="field"><label class="field-label">Type</label><select id="new-year-mode"><option value="tracked">Tracked \u2014 plan lessons &amp; grade live</option><option value="historical">Historical \u2014 type in final grades</option></select></div>'+
      '</div>'+
      '<div class="btn-row" style="display:flex;gap:8px;justify-content:flex-end;"><button class="btn" data-action="year-add-cancel">Cancel</button><button class="btn btn-primary" data-action="year-add-submit">'+icon('plus')+' Create year</button></div>'+
    '</div>'
  ) : '<button class="btn btn-primary" style="margin-top:14px;" data-action="year-add-open">'+icon('plus')+' Add school year</button>';

  return '<div class="eyebrow">School years</div><p class="helptext">Changes save automatically as you type. The active year is what Planner, Grades, and Dashboard show \u2014 add a new year when you\u2019re ready to move into it; last year stays exactly as it was, and both show up on the Transcript.</p>'+
    rows + studentGradeRows + addForm;
}

function renderSetupStudents(){
  var yr = activeYear();
  var rows = state.data.students.map(function(s){
    var grade = gradeLabelFor(s.id, state.data.activeYearId);
    var isOpen = state.studentDetailsOpenId===s.id;
    var row = '<div class="row-item">'+
      '<span class="swatch" style="background:var(--'+s.color+')" title="Click to change color" data-action="student-color" data-id="'+s.id+'"></span>'+
      '<input type="text" class="grow" value="'+esc(s.name)+'" placeholder="Name" '+bindAttrs('students',s.id,'name')+'>'+
      '<input type="text" value="'+esc(grade)+'" placeholder="Grade level" style="max-width:130px;" title="Grade for '+esc(yr.label)+'" '+bindAttrs('studentYear',s.id,'gradeLabel')+'>'+
      '<input type="date" value="'+esc(s.dob||'')+'" title="Date of birth \u2014 optional, only used on the transcript header" '+bindAttrs('students',s.id,'dob')+'>'+
      '<button class="btn btn-sm btn-ghost" data-action="student-details-toggle" data-id="'+s.id+'" title="Sex, address, phone, graduation date, diploma earned, and additional info \u2014 optional, only used on the transcript">'+icon(isOpen?'chevronUp':'chevronDown')+' Details</button>'+
      renderDeleteIconBtn('student:'+s.id)+
    '</div>';
    return row + (isOpen ? renderStudentDetails(s) : '');
  }).join('');
  return '<div class="eyebrow">Learners</div><p class="helptext">Changes save automatically as you type. Grade level is for the active school year (currently \u2018'+esc(yr.label)+'\u2019) \u2014 use the Years tab to add a new year when someone moves up; nothing is calculated from age. Birthdate is optional and only appears on the transcript header.</p>'+
    (rows || '<p class="helptext">No students yet.</p>')+
    '<div style="margin-top:14px;"><button class="btn btn-primary" data-action="student-add">'+icon('plus')+' Add student</button></div>';
}

// Setup > Students "Details" panel — Sex, Street Address, City/State/Zip,
// Phone, and graduation dates. All optional, same treatment as the dob
// field above: transcript-only, no effect anywhere else in the app.
// Collapsed by default (BACKLOG.md "Student demographics" — kept out of
// the everyday row since it's only needed once a student's Transcript
// header is being prepared).
function renderStudentDetails(s){
  return '<div class="panel" style="margin:-2px 0 12px 0;background:var(--paper);">'+
    '<div class="field-row">'+
      '<div class="field"><label class="field-label">Sex<span class="field-optional"> (optional)</span></label>'+
        '<select '+bindAttrs('students',s.id,'sex')+'>'+
          '<option value=""'+(!s.sex?' selected':'')+'>—</option>'+
          '<option value="Male"'+(s.sex==='Male'?' selected':'')+'>Male</option>'+
          '<option value="Female"'+(s.sex==='Female'?' selected':'')+'>Female</option>'+
        '</select>'+
      '</div>'+
      '<div class="field"><label class="field-label">Phone<span class="field-optional"> (optional)</span></label>'+
        '<input type="text" value="'+esc(s.phone||'')+'" placeholder="(555) 555-5555" '+bindAttrs('students',s.id,'phone')+'>'+
      '</div>'+
    '</div>'+
    '<div class="field-row">'+
      '<div class="field"><label class="field-label">Street address<span class="field-optional"> (optional)</span></label>'+
        '<input type="text" value="'+esc(s.streetAddress||'')+'" placeholder="123 Main St" '+bindAttrs('students',s.id,'streetAddress')+'>'+
      '</div>'+
      '<div class="field"><label class="field-label">City/State/Zip<span class="field-optional"> (optional)</span></label>'+
        '<input type="text" value="'+esc(s.cityStateZip||'')+'" placeholder="Winston-Salem, NC 27101" '+bindAttrs('students',s.id,'cityStateZip')+'>'+
      '</div>'+
    '</div>'+
    '<div class="field-row">'+
      '<div class="field"><label class="field-label">Expected graduation date<span class="field-optional"> (optional)</span></label>'+
        '<input type="date" value="'+esc(s.expectedGraduationDate||'')+'" title="Shown on the transcript until an actual graduation date is set" '+bindAttrs('students',s.id,'expectedGraduationDate')+'>'+
      '</div>'+
      '<div class="field"><label class="field-label">Graduation date<span class="field-optional"> (optional)</span></label>'+
        '<input type="date" value="'+esc(s.graduationDate||'')+'" title="Once set, this replaces the expected graduation date on the transcript" '+bindAttrs('students',s.id,'graduationDate')+'>'+
      '</div>'+
    '</div>'+
    '<div class="field-row">'+
      '<div class="field"><label class="field-label">Diploma earned<span class="field-optional"> (optional)</span></label>'+
        '<select '+bindAttrs('students',s.id,'diplomaEarned')+'>'+
          '<option value=""'+(!s.diplomaEarned?' selected':'')+'>—</option>'+
          '<option value="Yes"'+(s.diplomaEarned==='Yes'?' selected':'')+'>Yes</option>'+
          '<option value="No"'+(s.diplomaEarned==='No'?' selected':'')+'>No</option>'+
        '</select>'+
      '</div>'+
    '</div>'+
    '<div class="field-row">'+
      '<div class="field"><label class="field-label">Interests &amp; abilities<span class="field-optional"> (optional)</span></label>'+
        '<textarea rows="3" placeholder="e.g. Woodworking, chess, piano" '+bindAttrs('students',s.id,'interestsAbilities')+'>'+esc(s.interestsAbilities||'')+'</textarea>'+
      '</div>'+
      '<div class="field"><label class="field-label">Achievements<span class="field-optional"> (optional)</span></label>'+
        '<textarea rows="3" placeholder="e.g. Regional science fair, 1st place" '+bindAttrs('students',s.id,'achievements')+'>'+esc(s.achievements||'')+'</textarea>'+
      '</div>'+
      '<div class="field"><label class="field-label">Volunteer &amp; extracurricular<span class="field-optional"> (optional)</span></label>'+
        '<textarea rows="3" placeholder="e.g. Food bank, 3 years" '+bindAttrs('students',s.id,'volunteerExtracurricular')+'>'+esc(s.volunteerExtracurricular||'')+'</textarea>'+
      '</div>'+
    '</div>'+
    '<p class="helptext" style="margin-top:0;">Only used on '+esc(s.name)+'’s Transcript (header, Academic Record Summary, and Additional Student Information) — doesn’t affect anything else.</p>'+
    renderStudentEnrolledYears(s)+
  '</div>';
}

function renderSetupSubjects(){
  if(!state.data.students.length) return '<p class="helptext">Add a student first.</p>';
  var years = sortedYears();
  var selYearId = state.subjectsYearId || state.data.activeYearId;
  var yearSelect = '<div class="field" style="max-width:280px;margin-bottom:16px;"><label class="field-label">Editing subjects for</label><select id="subj-year-select" data-action-change="subjects-year-select">'+
    years.map(function(y){ return '<option value="'+y.id+'"'+(y.id===selYearId?' selected':'')+'>'+esc(y.label)+(y.id===state.data.activeYearId?' (active)':'')+'</option>'; }).join('')+
  '</select></div>';

  var selYear = getYear(selYearId);
  if(!selYear || selYear.mode!=='tracked'){
    return yearSelect + '<p class="helptext">That\u2019s a historical year \u2014 enter its courses directly on the Transcript page instead of here.</p>';
  }

  var yearsOrdered = years;
  var idx = yearsOrdered.findIndex(function(y){return y.id===selYearId;});
  var prevYear = idx>0 ? yearsOrdered[idx-1] : null;

  var body = state.data.students.map(function(s){
    var subs = studentSubjectsForYear(s.id, selYearId);
    var rows = subs.map(function(su){
      return '<div class="row-item">'+
        '<input type="text" class="grow" value="'+esc(su.name)+'" placeholder="Subject" '+bindAttrs('subjects',su.id,'name')+'>'+
        '<input type="text" value="'+esc(su.category||'')+'" placeholder="Category" style="max-width:100px;" title="e.g. Math, English, Elective" '+bindAttrs('subjects',su.id,'category')+'>'+
        '<input type="number" step="0.5" value="'+(su.creditHours!=null?su.creditHours:1)+'" style="max-width:70px;" title="Credit hours" '+bindAttrs('subjects',su.id,'creditHours')+'>'+
        '<input type="number" step="1" value="'+(su.targetTotal!=null?su.targetTotal:'')+'" placeholder="Target #" style="max-width:85px;" '+bindAttrs('subjects',su.id,'targetTotal')+'>'+
        '<input type="text" value="'+esc(su.unitLabel||'')+'" placeholder="Unit" style="max-width:85px;" '+bindAttrs('subjects',su.id,'unitLabel')+'>'+
        renderDeleteIconBtn('subject:'+su.id)+
      '</div>';
    }).join('');

    var carry = '';
    if(prevYear){
      var prevSubs = studentSubjectsForYear(s.id, prevYear.id);
      var alreadyCarried = {};
      subs.forEach(function(cs){ alreadyCarried[cs.name.toLowerCase()] = true; });
      var carriable = prevSubs.filter(function(ps){ return !alreadyCarried[ps.name.toLowerCase()]; });
      if(carriable.length){
        carry = '<div class="banner" style="background:var(--indigo-soft);border-color:var(--indigo);color:var(--indigo-text);">'+
          '<div style="font-weight:600;margin-bottom:6px;">Carry forward from '+esc(prevYear.label)+'?</div>'+
          carriable.map(function(ps){
            var ckey = s.id+':'+ps.id;
            var checked = state.carryForwardChecked[ckey] ? 'checked' : '';
            return '<label style="display:inline-flex;align-items:center;gap:5px;margin:3px 10px 3px 0;font-weight:400;color:var(--ink);">'+
              '<input type="checkbox" data-action-change="carry-toggle" data-key="'+ckey+'" '+checked+'> '+esc(ps.name)+'</label>';
          }).join('')+
          '<div style="margin-top:8px;"><button class="btn btn-sm btn-primary" data-action="carry-forward-submit" data-student="'+s.id+'" data-fromyear="'+prevYear.id+'" data-toyear="'+selYearId+'">Carry forward checked subjects</button></div>'+
        '</div>';
      }
    }

    return '<div style="margin-bottom:18px;"><div class="eyebrow" style="color:var(--'+s.color+');">'+esc(s.name)+'</div>'+
      carry+
      (rows || '<p class="helptext">No subjects yet for this year.</p>')+
      '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;"><input type="text" id="new-subject-'+s.id+'" placeholder="New subject name" style="flex:1 1 200px;min-width:150px;max-width:200px;">'+
      '<button class="btn btn-sm" data-action="subject-add" data-student="'+s.id+'" data-year="'+selYearId+'">'+icon('plus')+' Add subject</button></div></div>';
  }).join('');

  return yearSelect + '<p class="helptext" style="margin-top:-10px;margin-bottom:14px;">Changes to existing subjects save automatically.</p>' + body;
}

function renderSyncPanel(){

    html += '<p class="helptext">Not available right now — the sync service didn’t load. Check your internet connection and reload the page.</p></div>';

  }
  if(syncMode()==='firebase'){
    if(state.syncNeedsReconnect || !firebaseUser){
      html += '<p class="helptext">This device needs to sign in again before it can sync.</p>'+
        (syncHasUnpushedLocalChanges ? '<p class="helptext" style="color:var(--danger-text);">This device also has changes that haven’t been saved to the cloud yet — signing in will ask before deciding what to do with them.</p>' : '')+
        renderFirebaseSignInForm('sync-reconnect', 'Sign in and reconnect')+

      html += '<p class="helptext">Signed in as '+esc(firebaseUser.email)+' — changes made on this device save to the cloud, and changes from other connected devices show up here automatically.</p>';

/* ---- generic auto-save field binding: any input with data-bind-collection saves on every keystroke ---- */
var BIND_NUMBER_DEFAULTS = {creditHours:1, targetTotal:null, min:0, gpa:0, credit:1, gradePct:0};
function bindLookup(coll, id){
  if(coll==='students') return getStudent(id);
  if(coll==='quarters') return getQuarter(id);
  if(coll==='subjects') return getSubject(id);
  if(coll==='years') return getYear(id);
  if(coll==='scale') return state.data.scale.find(function(b){return b.id===id;});
  if(coll==='hist') return state.data.historicalCourses.find(function(h){return h.id===id;});
  if(coll==='ts') return state.data.testScores.find(function(t){return t.id===id;});
  if(coll==='ps') return state.data.previousSchools.find(function(p){return p.id===id;});
  return null;
}
document.addEventListener('input', function(e){
  var t = e.target;
  var coll = t.getAttribute('data-bind-collection');
  if(!coll) return;
  var id = t.getAttribute('data-bind-id');
  var field = t.getAttribute('data-bind-field');
  var raw = t.value;
  var val = (field in BIND_NUMBER_DEFAULTS) ? (raw===''? BIND_NUMBER_DEFAULTS[field] : Number(raw)) : raw;

  if(coll==='school'){
    state.data.school[field] = val;
    saveData();
    return;
  }
  if(coll==='studentYear'){
    var rec = getStudentYearInfo(id, state.data.activeYearId);
    if(!rec){ rec = {id:uid('syi'), studentId:id, yearId:state.data.activeYearId, gradeLabel:''}; state.data.studentYearInfo.push(rec); }
    rec[field] = val;
    saveData();
    return;
  }
  var target = bindLookup(coll, id);
  if(!target) return;
  target[field] = val;
  saveData();
});

document.addEventListener('change', function(e){
  var t = e.target.closest('[data-action-change]');
  if(!t) return;
  var action = t.getAttribute('data-action-change');
  if(action==='planner-filter-subject'){ state.plannerFilters.subjectId = t.value; render(); }
  else if(action==='planner-filter-quarter'){ state.plannerFilters.quarterId = t.value; render(); }
  else if(action==='lesson-status'){ doLessonStatusChange(t.getAttribute('data-id'), t.value); }
  else if(action==='grades-select-lesson'){ state.gradesSelectedLessonId = t.value; render(); }
  else if(action==='switch-year'){ mutateAndSave(function(){ state.data.activeYearId = t.value; }); }
  else if(action==='subjects-year-select'){ state.subjectsYearId = t.value; render(); }
  else if(action==='attendance-select-year'){ state.attendanceYearId = t.value; render(); }
  else if(action==='attendance-override-set'){ doAttendanceOverrideSet(t.getAttribute('data-student'), t.getAttribute('data-year'), t.value); }
  else if(action==='carry-toggle'){
    var key = t.getAttribute('data-key');
    state.carryForwardChecked[key] = t.checked;
  }
  else if(action==='import-file-change'){
    var file = t.files && t.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var ta = el('import-textarea');
      if(ta) ta.value = reader.result;
    };
    reader.readAsText(file);
  }
  else if(action==='hist-import-file-change'){
    var histFile = t.files && t.files[0];
    if(!histFile) return;
    var histReader = new FileReader();
    histReader.onload = function(){
      var histTa = el('hist-import-textarea');
      if(histTa) histTa.value = histReader.result;
    };
    histReader.readAsText(histFile);
  }
  else if(action==='restore-file-change'){
    var rfile = t.files && t.files[0];
    if(!rfile) return;
    var rreader = new FileReader();
    rreader.onload = function(){
      state.restoreError = null; state.restorePreview = null; state.restoreParsedData = null;
      var parsed;
      try{ parsed = JSON.parse(rreader.result); }
      catch(e){ state.restoreError = 'That file isn’t valid JSON.'; render(); return; }
      if(!parsed || typeof parsed!=='object' || !Array.isArray(parsed.students) || !Array.isArray(parsed.subjects) ||
         !Array.isArray(parsed.lessons) || !Array.isArray(parsed.scale) || !parsed.school){
        state.restoreError = 'That doesn’t look like a Homeroom backup file.';
        render(); return;
      }
      var migrated;
      try{ migrated = migrateData(parsed); }
      catch(e){ state.restoreError = 'Could not read that backup file.'; render(); return; }
      state.restoreParsedData = migrated;
      state.restorePreview = {
        years: (migrated.years||[]).length,
        students: (migrated.students||[]).length,
        subjects: (migrated.subjects||[]).length,
        lessons: (migrated.lessons||[]).length
      };
      render();
    };
    rreader.readAsText(rfile);
  }
});

/* ---- Planner bulk import ---- */
function parseImportLine(line){
  line = line.replace(/\r$/,'');
  if(!line.trim()) return null;
  var delim = line.indexOf('\t')!==-1 ? '\t' : ',';
  var idx1 = line.indexOf(delim);
  if(idx1===-1) return null;
  var idx2 = line.indexOf(delim, idx1+1);
  if(idx2===-1) return null;
  return {
    subject: line.substring(0,idx1).trim(),
    quarter: line.substring(idx1+1,idx2).trim(),
    title: line.substring(idx2+1).trim()
  };
}
function doImportPreview(){
  var ta = el('import-textarea');
  if(!ta) return;
  var text = ta.value;
  state.plannerImportRawText = text;
  var subs = studentSubjects(state.activeStudentId);
  var quarters = yearQuarters(state.data.activeYearId);
  var lines = text.split('\n');
  var rows = [];
  lines.forEach(function(line, i){
    var parsed = parseImportLine(line);
    if(!parsed) return;
    if(i===0 && /subject/i.test(parsed.subject) && /quarter/i.test(parsed.quarter)) return;
    var subj = subs.find(function(s){return s.name.toLowerCase()===parsed.subject.toLowerCase();});
    var qtr = quarters.find(function(q){return q.name.toLowerCase()===parsed.quarter.toLowerCase();});
    rows.push({title:parsed.title, rawSubject:parsed.subject, rawQuarter:parsed.quarter, subjectId:subj?subj.id:null, quarterId:qtr?qtr.id:null, ok: !!(subj&&qtr&&parsed.title)});
  });
  if(!rows.length){ showToast('Couldn\u2019t find any rows to import \u2014 check the format.', true); return; }
  state.plannerImportPreview = rows;
  render();
}

function csvSafe(s){
  s = String(s==null?'':s);
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function doExportReportCsv(studentId){
  var student = getStudent(studentId);
  if(!student) return;
  var subs = reportSubjectsFor(studentId);
  if(!subs.length){ showToast('No graded subjects yet — nothing to export.'); return; }
  var quarters = yearQuarters(state.data.activeYearId);
  var lines = [['Course'].concat(quarters.map(function(q){return q.name+' %';})).concat(quarters.map(function(q){return q.name+' Grade';})).concat(['Cumulative %','Cumulative Grade','GPA']).join(',')];
  subs.forEach(function(su){
    var row = [csvSafe(su.name)];
    var pcts=[], letters=[];
    quarters.forEach(function(q){
      var agg = quarterAggregate(studentId, su.id, q.id);
      pcts.push(agg?agg.pct.toFixed(1):''); letters.push(agg?agg.letter:'');
    });
    var cum = cumulativeAggregate(studentId, su.id);
    row = row.concat(pcts).concat(letters).concat([cum?cum.pct.toFixed(1):'', cum?cum.letter:'', (cum&&cum.gpa!=null)?cum.gpa.toFixed(1):'']);
    lines.push(row.join(','));
  });
  var blob = new Blob([lines.join('\n')], {type:'text/csv'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = student.name.replace(/\s+/g,'_')+'_progress_report.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---- Historical courses bulk import ---- */
// Type, Course Title, Grade %, Credit — comma or tab separated. The first
// field is always Type and the last two are always Grade %/Credit, with
// everything in between joined back into Title, so a title that itself
// contains the delimiter (e.g. "AP U.S. History, Part 1") still splits
// correctly.
function parseHistImportLine(line){
  line = line.replace(/\r$/,'');
  if(!line.trim()) return null;
  var delim = line.indexOf('\t')!==-1 ? '\t' : ',';
  var parts = line.split(delim);
  if(parts.length<4) return null;
  return {
    type: parts[0].trim(),
    title: parts.slice(1, parts.length-2).join(delim).trim(),
    rawPct: parts[parts.length-2].trim(),
    rawCredit: parts[parts.length-1].trim()
  };
}
function doHistImportPreview(){
  var ta = el('hist-import-textarea');
  if(!ta) return;
  var text = ta.value;
  state.histImportRawText = text;
  var lines = text.split('\n');
  var rows = [];
  lines.forEach(function(line, i){
    var parsed = parseHistImportLine(line);
    if(!parsed) return;
    if(i===0 && /type/i.test(parsed.type) && /title/i.test(parsed.title)) return;
    var pctStr = parsed.rawPct.replace(/%$/,'').trim();
    var pct = pctStr==='' ? NaN : Number(pctStr);
    var credit = parsed.rawCredit==='' ? 1 : Number(parsed.rawCredit);
    var ok = !!parsed.title && isFinite(pct) && isFinite(credit);
    rows.push({type:parsed.type, title:parsed.title, pct:pct, credit:credit, ok:ok});
  });
  if(!rows.length){ showToast('Couldn’t find any rows to import — check the format.', true); return; }
  state.histImportPreview = rows;
  render();
}
