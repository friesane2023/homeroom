function doConfirmDelete(key){
  if(state.confirmArmed !== key){ state.confirmArmed = key; render(); return; }
  state.confirmArmed = null;
  var parts = key.split(':');
  var type = parts[0], id = parts.slice(1).join(':');

  if(type==='lesson'){
    mutateAndSave(function(){
      state.data.lessons = state.data.lessons.filter(function(l){return l.id!==id;});
      if(state.editingLessonId===id) state.editingLessonId=null;
      if(state.gradesSelectedLessonId===id) state.gradesSelectedLessonId='';
    });
    showToast('Lesson deleted.');
  } else if(type==='student'){
    mutateAndSave(function(){
      state.data.students = state.data.students.filter(function(s){return s.id!==id;});
      state.data.subjects = state.data.subjects.filter(function(s){return s.studentId!==id;});
      state.data.lessons = state.data.lessons.filter(function(l){return l.studentId!==id;});
      state.data.studentYearInfo = state.data.studentYearInfo.filter(function(r){return r.studentId!==id;});
      state.data.historicalCourses = state.data.historicalCourses.filter(function(h){return h.studentId!==id;});
      state.data.testScores = state.data.testScores.filter(function(t){return t.studentId!==id;});
      state.data.previousSchools = state.data.previousSchools.filter(function(p){return p.studentId!==id;});
      delete state.data.attendance[id];
      delete state.data.attendanceOverride[id];
      if(state.activeStudentId===id) state.activeStudentId = state.data.students.length? state.data.students[0].id : null;
      if(state.reportStudentId===id) state.reportStudentId = state.data.students.length? state.data.students[0].id : null;
      if(state.transcriptStudentId===id) state.transcriptStudentId = state.data.students.length? state.data.students[0].id : null;
      if(state.diplomaStudentId===id) state.diplomaStudentId = state.data.students.length? state.data.students[0].id : null;
      if(state.attendanceStudentId===id) state.attendanceStudentId = state.data.students.length? state.data.students[0].id : null;
    });
    showToast('Student removed.');
  } else if(type==='quarter'){
    if(state.data.lessons.some(function(l){return l.quarterId===id;})){
      render(); showToast('That quarter has lessons in it \u2014 move or delete those first.', true); return;
    }
    mutateAndSave(function(){ state.data.quarters = state.data.quarters.filter(function(q){return q.id!==id;}); });
    showToast('Quarter removed.');
  } else if(type==='subject'){
    if(state.data.lessons.some(function(l){return l.subjectId===id;})){
      render(); showToast('That subject has graded work \u2014 remove those lessons first.', true); return;
    }
    mutateAndSave(function(){ state.data.subjects = state.data.subjects.filter(function(s){return s.id!==id;}); });
    showToast('Subject removed.');
  } else if(type==='scale'){
    if(state.data.scale.length<=1){ render(); showToast('Keep at least one grade band.', true); return; }
    mutateAndSave(function(){ state.data.scale = state.data.scale.filter(function(b){return b.id!==id;}); });
  } else if(type==='year'){
    if(id===state.data.activeYearId){ render(); showToast('Set a different year as active before deleting this one.', true); return; }
    var hasAttendance = Object.keys(state.data.attendance).some(function(sid){ return state.data.attendance[sid] && state.data.attendance[sid][id] && Object.keys(state.data.attendance[sid][id]).length; });
    var hasHolidays = state.data.holidays[id] && Object.keys(state.data.holidays[id]).length;
    var hasAttendanceOverride = Object.keys(state.data.attendanceOverride).some(function(sid){ return attendanceOverrideDays(sid, id)!=null; });
    var hasData = state.data.subjects.some(function(s){return s.yearId===id;}) || state.data.historicalCourses.some(function(h){return h.yearId===id;}) || hasAttendance || hasHolidays || hasAttendanceOverride;
    if(hasData){ render(); showToast('That year still has courses, attendance, or holidays in it \u2014 remove those first.', true); return; }
    mutateAndSave(function(){
      state.data.years = state.data.years.filter(function(y){return y.id!==id;});
      state.data.quarters = state.data.quarters.filter(function(q){return q.yearId!==id;});
      state.data.studentYearInfo = state.data.studentYearInfo.filter(function(r){return r.yearId!==id;});
      delete state.data.holidays[id];
    });
    showToast('Year removed.');
  } else if(type==='unenroll'){
    var unenrollParts = id.split('|'), studentId = unenrollParts[0], yearId = unenrollParts[1];
    if(studentHasYearData(studentId, yearId)){
      render(); showToast('That year still has courses, grades, or attendance — remove those first.', true); return;
    }
    mutateAndSave(function(){
      state.data.studentYearInfo = state.data.studentYearInfo.filter(function(r){ return !(r.studentId===studentId && r.yearId===yearId); });
    });
    showToast('Removed from that year.');
  } else if(type==='hist'){
    mutateAndSave(function(){
      state.data.historicalCourses = state.data.historicalCourses.filter(function(h){return h.id!==id;});
      if(state.editingHistRowId===id) state.editingHistRowId=null;
    });
    showToast('Course removed.');
  } else if(type==='ts'){
    mutateAndSave(function(){
      state.data.testScores = state.data.testScores.filter(function(t){return t.id!==id;});
      if(state.editingTestScoreId===id) state.editingTestScoreId=null;
    });
    showToast('Test score removed.');
  } else if(type==='ps'){
    mutateAndSave(function(){
      state.data.previousSchools = state.data.previousSchools.filter(function(p){return p.id!==id;});
      if(state.editingPrevSchoolId===id) state.editingPrevSchoolId=null;
    });
    showToast('Previous school removed.');
  } else if(type==='reset'){
    mutateAndSave(function(){ state.data = defaultData(); state.activeStudentId=null; state.reportStudentId=null; state.transcriptStudentId=null; state.diplomaStudentId=null; });
    showToast('All data reset.');
  } else if(type==='restore'){
    if(!state.restoreParsedData){ showToast('Choose a backup file first.', true); return; }
    mutateAndSave(function(){
      state.data = state.restoreParsedData;
      state.activeStudentId=null; state.reportStudentId=null; state.transcriptStudentId=null; state.diplomaStudentId=null;
      state.restoreOpen=false; state.restorePreview=null; state.restoreError=null; state.restoreParsedData=null;
    });
    showToast('Data restored from backup.');
  }
}


/* ---------------- init ---------------- */
loadData();
setInterval(function(){ checkDueNotifications(false); }, NOTIFY_CHECK_INTERVAL_MS);

})();

</script>
