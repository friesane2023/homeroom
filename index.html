<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homeroom — Homeschool Planner &amp; Gradebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F1E8;
    --paper-raised:#FFFFFF;
    --ink:#23312B;
    --ink-soft:#63706A;
    --ink-faint:#93998F;
    --rule:#DDD5C4;
    --rule-strong:#C9BFA9;
    --slate:#23333B;
    --slate-2:#2F4048;
    --pine:#3C6E5C;      --pine-soft:#E1EAE5;      --pine-text:#3C6E5C;
    --indigo:#48588A;    --indigo-soft:#E5E7F1;    --indigo-text:#48588A;
    --berry:#8C4A57;     --berry-soft:#F2E5E7;     --berry-text:#8C4A57;
    --amber:#B9873A;     --amber-soft:#F3E8D6;     --amber-text:#7A5A22;
    --danger:#A8433A;    --danger-soft:#F5E4E1;    --danger-text:#A8433A;
    --well:#EFEAE0;
    --btn-hover-bg:#FBFAF6;
    --overlay-hover-weak:rgba(35,49,43,.06);
    --overlay-hover:rgba(35,49,43,.07);
    --radius:10px;
    --radius-sm:6px;
    --shadow:0 1px 2px rgba(35,49,43,.08), 0 6px 16px rgba(35,49,43,.07);
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme:light;
  }
  /* Dark theme (BACKLOG.md "Dark mode toggle"): a second value set for the
     same variables above, activated by data-theme="dark" on <html> (see
     applyTheme() in the script). --slate/--slate-2 and the plain accent
     colors (--pine/--indigo/--berry/--amber/--danger) are deliberately left
     unset here so they fall back to the :root values above — those are used
     as solid fills behind white text (buttons, the topbar, dashboard card
     headers) and stay correct unchanged in both themes. The *-text variants
     are what badge/banner/label text actually uses, so those get brighter
     dark-mode values without touching the solid-fill colors. */
  html[data-theme="dark"]{
    --paper:#1B211D;
    --paper-raised:#242B26;
    --ink:#ECE7DA;
    --ink-soft:#A7AFA6;
    --ink-faint:#6E766E;
    --rule:#37413A;
    --rule-strong:#4A5548;
    --pine-soft:#1F332C;     --pine-text:#7FCDB3;
    --indigo-soft:#232840;   --indigo-text:#9AAAE8;
    --berry-soft:#3A252A;    --berry-text:#E3A4B0;
    --amber-soft:#3A2E18;    --amber-text:#E0B064;
    --danger-soft:#3A211D;   --danger-text:#E6897B;
    --well:#2A322C;
    --btn-hover-bg:#2C332E;
    --overlay-hover-weak:rgba(255,255,255,.06);
    --overlay-hover:rgba(255,255,255,.09);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.35);
    color-scheme:dark;
  }
  /* Printing always uses the light palette, regardless of the active
     on-screen theme — same reasoning as .no-print hiding the topbar/nav:
     a printed page is white paper, not a screen. */
  @media print{
    html[data-theme="dark"]{
      --paper:#F5F1E8; --paper-raised:#FFFFFF; --ink:#23312B; --ink-soft:#63706A;
      --ink-faint:#93998F; --rule:#DDD5C4; --rule-strong:#C9BFA9;
      --pine-soft:#E1EAE5; --pine-text:#3C6E5C;
      --indigo-soft:#E5E7F1; --indigo-text:#48588A;
      --berry-soft:#F2E5E7; --berry-text:#8C4A57;
      --amber-soft:#F3E8D6; --amber-text:#7A5A22;
      --danger-soft:#F5E4E1; --danger-text:#A8433A;
      --well:#EFEAE0; color-scheme:light;
    }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{ font-family:var(--font-display); margin:0; font-weight:600; color:var(--ink); }
  button, input, select, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  button{ cursor:pointer; }
  a{ color:inherit; }
  ::selection{ background:var(--pine-soft); }

  #app-root{ min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- Topbar ---------- */
  .topbar{
    background:var(--slate);
    color:#F2EFE6;
    padding:14px 20px;
    display:flex; align-items:center; gap:20px; flex-wrap:wrap;
    position:sticky; top:0; z-index:20;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  .brand{ display:flex; align-items:baseline; gap:10px; margin-right:auto; }
  .brand-mark{ font-family:var(--font-display); font-size:21px; font-weight:700; letter-spacing:.2px; }
  .brand-sub{ font-size:11.5px; color:#B9C2BE; font-family:var(--font-mono); letter-spacing:.03em; }
  .nav-tabs{ display:flex; gap:2px; background:rgba(255,255,255,.06); border-radius:999px; padding:3px; }
  .nav-tab{
    background:transparent; border:none; color:#CBD3CD; padding:8px 16px; border-radius:999px;
    font-size:13.5px; font-weight:600; letter-spacing:.01em; transition:background .15s, color .15s;
  }
  .nav-tab:hover{ color:#fff; }
  .nav-tab.active{ background:#F2EFE6; color:var(--slate); }
  .nav-tabs{ flex-wrap:wrap; }
  .year-switcher-select{ background:rgba(255,255,255,.1); color:#F2EFE6; border:1px solid rgba(255,255,255,.25); border-radius:8px; padding:6px 10px; font-size:12.5px; font-weight:600; }
  .year-switcher-select option{ color:var(--ink); }
  textarea{ min-height:110px; resize:vertical; font-family:var(--font-body); }

  /* ---------- Student folder tabs ---------- */
  .student-tabs{
    display:flex; gap:6px; padding:14px 20px 0 20px; flex-wrap:wrap;
    max-width:1180px; margin:0 auto; width:100%;
  }
  .student-tab{
    border:1px solid var(--rule); background:var(--paper-raised); padding:9px 16px 10px 16px;
    border-radius:10px 10px 0 0; font-weight:600; font-size:14px; color:var(--ink-soft);
    border-bottom:3px solid transparent; margin-bottom:-1px; display:flex; align-items:center; gap:8px;
  }
  .student-tab .dot{ width:8px; height:8px; border-radius:50%; }
  .student-tab.active{ color:var(--ink); border-bottom-color: var(--tab-accent, var(--pine)); background:var(--paper-raised); box-shadow:var(--shadow); }
  .student-tab:not(.active):hover{ color:var(--ink); }

  main{ flex:1; max-width:1180px; margin:0 auto; width:100%; padding:22px 20px 60px 20px; }

  /* ---------- Generic building blocks ---------- */
  .panel{
    background:var(--paper-raised); border:1px solid var(--rule); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:20px;
  }
  .panel + .panel{ margin-top:16px; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .section-head h2{ font-size:19px; }
  .section-head .hint{ color:var(--ink-soft); font-size:13px; }
  .eyebrow{ font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:4px; }

  .btn{
    display:inline-flex; align-items:center; gap:6px; border-radius:8px; border:1px solid var(--rule-strong);
    background:var(--paper-raised); color:var(--ink); padding:8px 14px; font-weight:600; font-size:13.5px;
    transition:background .15s, border-color .15s, transform .05s;
  }
  .btn:hover{ background:var(--btn-hover-bg); border-color:var(--ink-faint); }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--pine); border-color:var(--pine); color:#fff; }
  .btn-primary:hover{ background:#335F50; border-color:#335F50; }
  .btn-ghost{ background:transparent; border-color:transparent; padding:6px 8px; }
  .btn-ghost:hover{ background:var(--overlay-hover-weak); }
  .btn-danger{ border-color:var(--danger-text); color:var(--danger-text); }
  .btn-danger:hover{ background:var(--danger-soft); }
  .btn-danger.armed{ background:var(--danger); color:#fff; }
  .btn-sm{ padding:5px 10px; font-size:12.5px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .icon-btn{ width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; border-radius:7px; border:1px solid transparent; background:transparent; color:var(--ink-soft); }
  .icon-btn:hover{ background:var(--overlay-hover); color:var(--ink); }
  .icon-btn svg{ width:16px; height:16px; }

  label.field-label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; letter-spacing:.01em; }
  .field-optional{ font-weight:400; text-transform:none; letter-spacing:0; color:var(--ink-faint); }
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%; padding:9px 11px; border:1px solid var(--rule-strong); border-radius:7px; background:var(--paper-raised); color:var(--ink);
  }
  input:focus, select:focus, textarea:focus, button:focus-visible{
    outline:2px solid var(--pine); outline-offset:1px; border-color:var(--pine);
  }
  .field-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:12px; }
  .field{ margin-bottom:12px; }

  .pill{ display:inline-flex; align-items:center; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:600; background:var(--rule); color:var(--ink-soft); }
  .grade-badge{ font-family:var(--font-mono); font-weight:600; padding:2px 8px; border-radius:6px; font-size:12.5px; display:inline-block; }
  .grade-A{ background:var(--pine-soft); color:var(--pine-text); }
  .grade-B{ background:var(--indigo-soft); color:var(--indigo-text); }
  .grade-C{ background:var(--amber-soft); color:var(--amber-text); }
  .grade-D{ background:var(--berry-soft); color:var(--berry-text); }
  .grade-F{ background:var(--danger-soft); color:var(--danger-text); }
  .grade-none{ color:var(--ink-faint); }

  .empty-state{ text-align:center; padding:44px 20px; border:1.5px dashed var(--rule-strong); border-radius:var(--radius); color:var(--ink-soft); }
  .empty-state h3{ font-size:17px; margin-bottom:6px; color:var(--ink); }
  .empty-state p{ margin:0 0 16px 0; font-size:13.5px; }

  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--slate); color:#fff;
    padding:10px 18px; border-radius:8px; font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,.25); z-index:100;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }
  .toast.error{ background:var(--danger); }
  .banner{ background:var(--amber-soft); border:1px solid var(--amber); color:var(--amber-text); padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; }

  /* ---------- Kanban ---------- */
  .filters-row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  .filters-row select{ width:auto; min-width:150px; }
  .board{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  @media (max-width:860px){
    .board{
      display:flex; grid-template-columns:none; overflow-x:auto;
      scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
      padding-bottom:4px; margin:0 -20px; padding-left:20px; padding-right:20px;
    }
    .board-col{ flex:0 0 88%; scroll-snap-align:start; }
  }
  .board-col{ background:var(--well); border-radius:var(--radius); padding:10px; min-height:80px; }
  .board-col-head{ display:flex; align-items:center; justify-content:space-between; padding:4px 6px 10px 6px; }
  .board-col-title{ font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); }
  .board-count{ font-family:var(--font-mono); font-size:11.5px; background:var(--paper-raised); border-radius:999px; padding:1px 8px; color:var(--ink-soft); }
  .card-stack{ display:flex; flex-direction:column; gap:8px; }
  .lesson-card{
    background:var(--paper-raised); border:1px solid var(--rule); border-left:4px solid var(--card-accent, var(--pine));
    border-radius:8px; padding:10px 12px; box-shadow:var(--shadow);
  }
  .lesson-card .lc-title{ font-weight:600; font-size:13.5px; margin-bottom:4px; }
  .lesson-card .lc-meta{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .lesson-card .lc-points{ font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); }
  .lesson-card .lc-controls{ display:flex; align-items:center; gap:6px; margin-top:8px; }
  .lesson-card select.status-select{ padding:5px 8px; font-size:12px; border-radius:6px; }
  .lesson-card .lc-actions{ margin-left:auto; display:flex; gap:2px; }
  .col-empty{ padding:16px 8px; text-align:center; color:var(--ink-faint); font-size:12.5px; }

  .due-badge{ display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; font-family:var(--font-mono); }
  .due-badge.due-overdue{ background:var(--danger-soft); color:var(--danger-text); }
  .due-badge.due-today{ background:var(--amber-soft); color:var(--amber-text); }
  .due-badge.due-soon{ background:var(--rule); color:var(--ink-soft); }
  .due-badge.due-later{ background:transparent; color:var(--ink-faint); padding-left:0; }

  .inline-edit{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--rule-strong); display:grid; gap:8px; }
  .inline-edit .btn-row{ display:flex; gap:8px; justify-content:flex-end; }

  /* ---------- Calendar ---------- */
  .cal-toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .cal-toolbar .cal-range{ font-weight:600; font-family:var(--font-mono); font-size:13px; color:var(--ink-soft); margin-right:auto; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:10px; }
  @media (max-width:900px){ .cal-grid{ grid-template-columns:repeat(2,1fr); } }
  .cal-day{ background:var(--paper-raised); border:1px solid var(--rule); border-radius:var(--radius-sm); padding:8px; min-height:120px; display:flex; flex-direction:column; gap:6px; }
  .cal-day.is-today{ border-color:var(--pine); box-shadow:0 0 0 1px var(--pine); }
  .cal-day.is-overdue{ background:var(--danger-soft); }
  .cal-day-head{ font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }
  .cal-day-head .cal-day-num{ font-weight:700; color:var(--ink); font-size:13px; }
  .cal-chip{ background:var(--paper); border:1px solid var(--rule); border-left:3px solid var(--chip-accent, var(--pine)); border-radius:6px; padding:5px 7px; font-size:11.5px; cursor:pointer; text-align:left; }
  .cal-chip:hover{ background:var(--rule); }
  .cal-chip .cal-chip-subj{ font-weight:700; display:block; }
  .cal-chip .cal-chip-title{ color:var(--ink-soft); }
  .cal-chip.cal-chip-done{ opacity:.55; text-decoration:line-through; }
  .cal-day-empty{ color:var(--ink-faint); font-size:11px; padding:4px 2px; }
  .cal-nodate-list{ display:flex; flex-direction:column; gap:6px; }
  .cal-nodate-row{ display:flex; align-items:center; gap:8px; padding:6px 8px; border:1px solid var(--rule); border-radius:7px; background:var(--paper-raised); font-size:12.5px; }
  .cal-nodate-row .grow{ flex:1; }

  .bell-btn{ background:transparent; border:1px solid rgba(255,255,255,.25); color:#F2EFE6; border-radius:8px; padding:6px 10px; font-size:13px; display:inline-flex; align-items:center; gap:6px; }
  .bell-btn:hover{ background:rgba(255,255,255,.1); }
  .bell-btn.is-on{ background:var(--pine); border-color:var(--pine); }

  /* ---------- Celebration ---------- */
  .confetti-overlay{ position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden; }
  .confetti-piece{
    position:absolute; top:-12px; width:8px; height:14px; opacity:.95; border-radius:2px;
    animation: confetti-fall var(--dur,1.2s) ease-in var(--delay,0s) forwards;
  }
  @keyframes confetti-fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(105vh) rotate(600deg); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .confetti-piece{ animation-duration:.01s; opacity:0; }
  }

  /* ---------- Tables / Reports ---------- */
  table.report-table{ width:100%; border-collapse:collapse; font-size:13px; }
  table.report-table th, table.report-table td{ border:1px solid var(--rule); padding:8px 9px; text-align:center; }
  table.report-table th{ background:var(--well); font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); font-weight:600; }
  table.report-table td.course-cell{ text-align:left; font-weight:600; font-family:var(--font-display); font-size:14px; }
  table.report-table td.num{ font-family:var(--font-mono); }
  .table-scroll{ overflow-x:auto; }
  .bar-row{ display:flex; align-items:center; gap:8px; }
  .bar-track{ flex:1; height:7px; background:var(--rule); border-radius:99px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:99px; }

  .rc-header{ display:grid; grid-template-columns:1fr 1fr; gap:4px 24px; margin-bottom:18px; font-size:13px; }
  .rc-header .rc-line{ display:flex; justify-content:space-between; gap:10px; border-bottom:1px dotted var(--rule-strong); padding-bottom:3px; }
  .rc-header .rc-line b{ font-weight:600; }
  .rc-title-row{ text-align:center; margin-bottom:6px; }
  .rc-title-row .school-name{ font-family:var(--font-display); font-size:22px; font-weight:700; }
  .rc-title-row .rc-tag{ font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; color:var(--ink-soft); text-transform:uppercase; }

  .legend-grid{ display:flex; gap:14px; flex-wrap:wrap; margin-top:16px; font-size:12px; color:var(--ink-soft); }
  .legend-grid span b{ color:var(--ink); }
  .rc-signature{ margin-top:22px; border-top:1px solid var(--rule); padding-top:14px; }

  /* Transcript — two-column pairing for recognized high-school years
     (9th-12th), matching the reference transcript template. A paired row
     halves each year's table width, so its own table gets a slightly
     smaller font/padding to stay legible — same on screen and at print,
     unlike the Reports-only print compaction above (this is a genuine
     layout change, not a print-only fix). Un-paired blocks (elementary/
     middle years, or an odd leftover HS year) render at full width and
     keep the standard table sizing. */
  .transcript-year-block{ margin-top:22px; }
  .transcript-pair-row{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:22px; align-items:start; }
  .transcript-pair-row .transcript-year-block{ margin-top:0; }
  .transcript-pair-row table.report-table{ font-size:11.5px; }
  .transcript-pair-row table.report-table th, .transcript-pair-row table.report-table td{ padding:5px 6px; }
  .transcript-pair-row table.report-table td.course-cell{ font-size:12.5px; }
  /* screen-only: unscoped, this also fired during print, since a printed
     page's effective width (well under 760px at typical margins) matches
     the same condition meant for a narrow phone screen — caught 2026-08-28
     via an actual print preview, where the 2x2 pairing silently collapsed
     to a single stacked column. */
  @media screen and (max-width:760px){
    .transcript-pair-row{ grid-template-columns:1fr; }
  }
  @media print{
    .transcript-pair-row{ page-break-inside:avoid; }
    .transcript-year-block{ page-break-inside:avoid; }
    .rc-transcript .legend-grid{ margin-top:4px; font-size:10px; }
    /* Academic Record Summary, Additional Student Info, Test Scores, and
       Previous Schools could otherwise split mid-list across a page break
       — caught 2026-08-28 via an actual print preview, where the
       Attendance list broke between 10th and 11th grade. Same
       avoid-inside-split treatment as the year blocks above. */
    .rc-avoid-break{ page-break-inside:avoid; }
  }

  .transcript-signatures{ display:flex; gap:40px; flex-wrap:wrap; margin-top:32px; }
  .transcript-signatures > div{ flex:1 1 220px; border-top:1px solid var(--rule); padding-top:8px; }
  .rc-sig-name{ font-family:var(--font-display); font-size:15px; font-weight:600; margin-bottom:2px; }
  .rc-sig-line{ font-size:11.5px; color:var(--ink-soft); font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.04em; }

  /* Reports print pagination — a typical course load (~6-9 subjects x 4
     quarters) was spilling a line or two onto a second page. Same
     technique as the Attendance print rules below: shrink font-size and
     padding at print time. Scoped to .rc-report specifically, not plain
     table.report-table, so Transcript and Grades' "Recently graded" table
     (which share that class) print unaffected — Transcript in particular
     may legitimately need more than one page and shouldn't be compacted. */
  @media print{
    .rc-report table.report-table{ font-size:10.5px; }
    .rc-report table.report-table th, .rc-report table.report-table td{ padding:4px 6px; }
    .rc-report table.report-table tbody tr{ page-break-inside:avoid; }
    .rc-report .rc-header{ font-size:11px; margin-bottom:10px; }
    .rc-report .legend-grid{ margin-top:8px; font-size:10px; }
    .rc-report .rc-signature{ margin-top:10px; padding-top:8px; }
  }

  /* ---------- Diploma ---------- */
  /* Deliberately more ceremonial than the Transcript/Report Card/
     Attendance sheet's plainer print treatment (BACKLOG.md "Printable
     high school diploma"). The compound .panel.diploma-frame selector
     (two classes, higher specificity than plain .panel) keeps the
     decorative border showing at print despite the general print rule
     above stripping .panel's own border/shadow. */
  .panel.diploma-frame{
    position:relative;
    padding:56px 48px;
    border:3px double var(--ink);
    text-align:center;
    background:var(--paper);
  }
  .diploma-frame::before{ content:''; position:absolute; inset:10px; border:1px solid var(--rule-strong); pointer-events:none; }
  .diploma-school-name{ font-family:var(--font-display); font-size:28px; font-weight:700; }
  .diploma-subtitle{ font-family:var(--font-mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); margin:22px 0 10px; }
  .diploma-student-name{ font-family:var(--font-display); font-style:italic; font-size:34px; font-weight:600; margin-bottom:22px; }
  .diploma-body{ max-width:560px; margin:0 auto 22px; font-size:14px; line-height:1.7; }
  .diploma-award{ font-family:var(--font-display); font-size:22px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; margin-bottom:22px; }
  .diploma-date{ font-size:13px; color:var(--ink-soft); font-style:italic; margin-bottom:36px; }
  .diploma-signatures{ display:flex; justify-content:center; gap:60px; flex-wrap:wrap; }
  .diploma-signatures > div{ flex:0 1 220px; border-top:1px solid var(--rule); padding-top:8px; }
  @media print{
    .panel.diploma-frame{ padding:64px 56px; }
  }

  /* ---------- Attendance ---------- */
  table.att-table{ font-size:11px; }
  table.att-table th, table.att-table td{ padding:4px 3px; }
  table.att-table td.att-month-label{ text-align:left; font-weight:600; font-family:var(--font-display); font-size:12.5px; white-space:nowrap; padding-left:9px; }
  table.att-table td.att-day{ cursor:pointer; font-weight:700; color:var(--pine-text); }
  table.att-table td.att-day:hover{ background:var(--pine-soft); }
  table.att-table td.att-checked{ background:var(--pine-soft); }
  table.att-table td.att-today{ box-shadow:inset 0 0 0 1.5px var(--pine); }
  table.att-table td.att-weekend{ background:#F2EFE6; color:var(--ink-faint); cursor:default; }
  table.att-table td.att-holiday{ background:#F2EFE6; color:var(--ink-faint); cursor:default; }
  table.att-table td.att-holiday[data-action]{ cursor:pointer; }
  table.att-table td.att-na{ background:repeating-linear-gradient(45deg, var(--rule) 0, var(--rule) 3px, transparent 3px, transparent 7px); }
  @media print{
    table.att-table{ font-size:8px; }
    table.att-table th, table.att-table td{ padding:2px 1px; }
  }

  /* ---------- Dashboard cards ---------- */
  .dash-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; }
  .dash-card{ border-radius:var(--radius); border:1px solid var(--rule); background:var(--paper-raised); box-shadow:var(--shadow); overflow:hidden; }
  .dash-card-head{ padding:14px 16px; color:#fff; display:flex; justify-content:space-between; align-items:baseline; }
  .dash-card-body{ padding:14px 16px; }
  .stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
  .stat{ text-align:center; background:var(--paper); border-radius:7px; padding:8px 4px; }
  .stat .num{ font-family:var(--font-mono); font-weight:600; font-size:16px; }
  .stat .lbl{ font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; }
  .dash-avg{ display:flex; align-items:baseline; gap:8px; margin-bottom:10px; }
  .dash-avg .big{ font-family:var(--font-mono); font-size:26px; font-weight:600; }

  /* ---------- Setup ---------- */
  .setup-tabs{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .setup-tab-btn{ padding:7px 14px; border-radius:8px; border:1px solid var(--rule-strong); background:var(--paper-raised); font-weight:600; font-size:13px; color:var(--ink-soft); }
  .setup-tab-btn.active{ background:var(--slate); color:#fff; border-color:var(--slate); }
  .row-item{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--rule); }
  .row-item:last-child{ border-bottom:none; }
  .row-item .grow{ flex:1; }
  .row-item input[type=text], .row-item input[type=number]{ width:auto; flex:1 1 110px; min-width:70px; }
  .row-item input.grow{ flex:2 1 160px; }
  .row-item input[type=date]{ width:auto; flex:0 0 152px; }
  .swatch{ width:20px; height:20px; border-radius:5px; border:1px solid rgba(0,0,0,.1); cursor:pointer; flex:none; }

  .helptext{ font-size:12.5px; color:var(--ink-soft); margin-top:4px; }
  .kbd{ font-family:var(--font-mono); background:var(--rule); padding:1px 5px; border-radius:4px; font-size:11px; }

  footer.app-footer{ text-align:center; padding:18px; color:var(--ink-faint); font-size:11.5px; font-family:var(--font-mono); }

  @media print{
    .topbar, .student-tabs, .no-print{ display:none !important; }
    /* The app-chrome page title + hint (e.g. "Transcript / Every school
       year in one record...") is UI copy, not part of the document being
       printed — every printable view (Transcript, Report Card,
       Attendance) already has its own real header inside its .panel.
       Caught 2026-08-28 via an actual print preview of the Transcript. */
    .section-head{ display:none !important; }
    /* A toast (e.g. "Test score added.") has no built-in expiry tied to
       print — if one's still fading out when Print is clicked, it would
       otherwise show up on the actual page. Caught alongside the above. */
    .toast{ display:none !important; }
    body{ background:#fff; }
    main{ padding:0; max-width:none; }
    .panel{ box-shadow:none; border:none; }
  }
</style>
</head>

<!-- Multi-device sync v2 (BACKLOG.md): Firebase's compat SDK, loaded as plain
     script tags — no bundler, no build step, index.html stays one file.
     Chosen over the modular/ESM SDK so it exposes one global `firebase`
     object usable directly from the existing single inline script's IIFE
     below, rather than needing to convert the app to ES modules. -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
(function(){
'use strict';

/* ---------------- dark mode (BACKLOG.md "Dark mode toggle") ----------------
   Applied as the very first thing this script does, before anything else
   runs, so <html> gets its data-theme attribute as early as possible and
   the page doesn't flash the wrong theme on load. Device-level preference
   (own localStorage key, not state.data) — same treatment as the
   celebrate/notify toggles and the sync-mode choice: doesn't travel through
   the family's synced data, so each device/kid can pick their own. */
var THEME_KEY = 'homeroom-theme';
var THEME_MEDIA = (typeof window!=='undefined' && window.matchMedia) ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function themePreference(){ // explicit user choice, or null to follow the OS setting
  try{ var v = window.localStorage.getItem(THEME_KEY); return (v==='light'||v==='dark') ? v : null; }
  catch(e){ return null; }
}
function setThemePreference(mode){ // mode is 'light' or 'dark'
  try{ window.localStorage.setItem(THEME_KEY, mode); }catch(e){}
}
function resolvedTheme(){
  var pref = themePreference();
  if(pref) return pref;
  return (THEME_MEDIA && THEME_MEDIA.matches) ? 'dark' : 'light';
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', resolvedTheme());
}
applyTheme();
if(THEME_MEDIA){
  // Only auto-follow the OS setting live for a device that's never made an
  // explicit choice — once someone's toggled it, that choice sticks.
  var onSystemThemeChange = function(){ if(!themePreference()){ applyTheme(); renderThemeToggle(); } };
  if(THEME_MEDIA.addEventListener) THEME_MEDIA.addEventListener('change', onSystemThemeChange);
  else if(THEME_MEDIA.addListener) THEME_MEDIA.addListener(onSystemThemeChange); // older Safari/Chrome
}
function doThemeToggle(){
  setThemePreference(resolvedTheme()==='dark' ? 'light' : 'dark');
  applyTheme();
  renderThemeToggle();
  showToast(resolvedTheme()==='dark' ? 'Dark mode on.' : 'Dark mode off.');
}
function renderThemeToggle(){
  var host = el('theme-toggle-host');
  if(!host) return;
  var dark = resolvedTheme()==='dark';
  host.innerHTML = '<button class="bell-btn'+(dark?' is-on':'')+'" data-action="theme-toggle" title="'+(dark?'Dark mode is on — click for light mode':'Turn on dark mode')+'">'+(dark?'🌙 Dark':'☀️ Light')+'</button>';
}

/* =========================================================
   SEED DATA — the family's real starting point for 2026–27.
   Five years, empty except for structure: no sample subjects, lessons, or
   historical courses. The 2022–23 through 2025–26 years are historical
   (summary-entry) records waiting on the kids' actual grades; 2026–27 is
   the new tracked-live year. See "Real multi-year seed data" in
   BACKLOG.md for the full spec this was built from.
   ========================================================= */


var STORAGE_KEY = 'homeroom-data-v2';
// Prefer Claude.ai's artifact storage when present (e.g. running as a claude.ai
// artifact); otherwise fall back to the browser's localStorage so data still
// persists when this file is opened directly / hosted normally.
var HAS_ARTIFACT_STORAGE = (typeof window !== 'undefined' && !!window.storage);
var HAS_LOCAL_STORAGE = (function(){
  try{
    if(typeof window === 'undefined' || !window.localStorage) return false;
    var t = '__homeroom_test__';
    window.localStorage.setItem(t, '1');
    window.localStorage.removeItem(t);
    return true;
  }catch(e){ return false; }
})();
var HAS_STORAGE = HAS_ARTIFACT_STORAGE || HAS_LOCAL_STORAGE;

// Multi-device sync v2 (BACKLOG.md "Multi-device sync v2: Firebase
// backend"): an opt-in, per-device mode that reads/writes state.data
// through a Firebase Realtime Database instead of only this browser's own
// storage. Replaces the original File System Access/OneDrive-file
// mechanism (Phase 1, 2026-08-30) — works on any modern browser, including
// Safari on iPad and Chrome on Android, which the old mechanism could not
// reach at all.
var HAS_FIREBASE = (typeof firebase !== 'undefined');
var FIREBASE_CONFIG = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.firebasestorage.app",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
// Not a secret — meant to be embedded in client code, same as this file's
// Google Fonts links. Real protection is the sign-in requirement plus the
// database's own security rules (see BACKLOG.md), not hiding this.
if(HAS_FIREBASE){ firebase.initializeApp(FIREBASE_CONFIG); }
var SYNC_MODE_KEY = 'homeroom-sync-mode'; // device-level preference, not state.data
function syncMode(){
  try{ return window.localStorage.getItem(SYNC_MODE_KEY)==='firebase' ? 'firebase' : 'local'; }catch(e){ return 'local'; }
}
function setSyncMode(mode){
  try{ window.localStorage.setItem(SYNC_MODE_KEY, mode); }catch(e){}
}
// Stable per-device id (not per-family — every device gets its own), used
// only to tell this device's own writes apart from another device's writes
// in the realtime listener below, so a device doesn't mistake its own save
// for a remote change. Not sensitive, not shared.
var DEVICE_ID_KEY = 'homeroom-device-id';
function deviceId(){
  try{
    var id = window.localStorage.getItem(DEVICE_ID_KEY);
    if(!id){ id = uid('dev'); window.localStorage.setItem(DEVICE_ID_KEY, id); }
    return id;
  }catch(e){ return 'dev_unknown'; }
}
var firebaseUser = null;             // the signed-in Firebase user on this device, this session
var firebaseLastKnownTimestamp = null; // server timestamp as of our last read/write, for the conflict guard
var firebaseMetaListenerRef = null;
// True whenever this device has made a change that didn't make it into the
// cloud yet (signed out, or the conflict guard held it back) — set in
// pushToFirebase, cleared on a successful push. Reconnect and Reload-latest
// both pull and overwrite state.data outright, so without this flag a
// device with edits stuck behind a lapsed sign-in would have them silently
// discarded the moment someone signs back in.
var syncHasUnpushedLocalChanges = false;

var STATUS_COLS = [
  {id:'todo', label:'To Do'},
  {id:'doing', label:'In Progress'},
  {id:'review', label:'Needs Review'},
  {id:'done', label:'Done'}
];
var COLOR_NAMES = ['pine','indigo','berry','amber'];

var state = {
  loaded:false,
  loadError:false,
  data:null,
  view:'dashboard',
  activeStudentId:null,
  plannerFilters:{subjectId:'all', quarterId:'all'},
  plannerAddOpen:false,

  plannerImportPreview:null,
  editingLessonId:null,
  gradesMode:'new',
  gradesSelectedLessonId:'',
  reportStudentId:null,
  transcriptStudentId:null,
  diplomaStudentId:null,
  attendanceStudentId:null,
  attendanceYearId:null,
  attendanceMode:'instruction', // 'instruction' | 'holiday' — which the grid's click toggles; ephemeral, never persisted
  setupTab:'students',
  subjectsYearId:null,
  carryForwardChecked:{},
  addingYear:false,
  addingHistYearFor:null,
  editingHistRowId:null,
  addingTestScoreFor:null, // studentId whose "Add test score" form is open, on the Transcript
  editingTestScoreId:null,

  editingPrevSchoolId:null,
  studentDetailsOpenId:null, // which student's Setup > Students "Details" (sex/address/phone) panel is expanded
  histImportYearFor:null,
  histImportPreview:null,
  histImportRawText:'',
  confirmArmed:null,
  toastTimer:null,
  calendarWeekStart:null,
  restoreOpen:false,
  restorePreview:null,
  restoreError:null,
  restoreParsedData:null,
  syncNeedsReconnect:false,     // was signed in to sync before, but isn't right now (needs to sign in again)
  syncFileChangedRemotely:false // another device saved to the cloud since we last read it
};

/* ---------------- utility ---------------- */
function uid(prefix){
  return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
}
function el(id){ return document.getElementById(id); }
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtPct(n){ return (Math.round(n*10)/10).toFixed(1) + '%'; }
function fmtDate(d){
  if(!d) return '';
  var parts = d.split('-');
  if(parts.length!==3) return d;
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[parseInt(parts[1],10)-1] + ' ' + parseInt(parts[2],10) + ', ' + parts[0];
}
// "Given this 31st day of May in the Year 2026" — the diploma's ceremonial
// date format, distinct from fmtDate's plain "May 31, 2026". Ordinal day +
// full month name; year stays numeral (not spelled out in words).
function fmtDateSpelledOut(d){
  if(!d) return '';
  var parts = d.split('-');
  if(parts.length!==3) return d;
  var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var day = parseInt(parts[2],10);
  var suffix = 'th';
  if(day%10===1 && day!==11) suffix='st';
  else if(day%10===2 && day!==12) suffix='nd';
  else if(day%10===3 && day!==13) suffix='rd';
  return day+suffix+' day of '+months[parseInt(parts[1],10)-1]+' in the Year '+parts[0];
}
// For the synced-file "last known sync" timestamp (a raw ms epoch from
// file.lastModified) — includes time of day, unlike fmtDate's plain-date form.
function fmtDateTime(ms){
  try{ return new Date(ms).toLocaleString(undefined, {dateStyle:'medium', timeStyle:'short'}); }
  catch(e){ return new Date(ms).toLocaleString(); }
}
function todayStr(){
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// parse a 'YYYY-MM-DD' string as a local-midnight Date (avoids the UTC
// off-by-one-day shift that `new Date('YYYY-MM-DD')` causes west of UTC)
function parseDateStr(d){
  if(!d) return null;
  var parts = d.split('-');
  if(parts.length!==3) return null;
  return new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
}
function dateToStr(dt){
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
function addDaysStr(d, n){
  var dt = parseDateStr(d);
  if(!dt) return d;
  dt.setDate(dt.getDate()+n);
  return dateToStr(dt);
}
// Monday of the week containing date string d
function mondayOfStr(d){
  var dt = parseDateStr(d) || new Date();
  var dow = dt.getDay(); // 0=Sun..6=Sat
  var diff = (dow===0) ? -6 : (1-dow);
  dt.setDate(dt.getDate()+diff);
  return dateToStr(dt);
}
function daysBetween(fromStr, toStr){
  var a = parseDateStr(fromStr), b = parseDateStr(toStr);
  if(!a || !b) return null;
  return Math.round((b-a)/86400000);
}
function dueBadgeInfo(l){
  if(!l.dueDate) return null;
  if(l.status==='done') return {cls:'due-later', label:'Due '+fmtDate(l.dueDate)};
  var diff = daysBetween(todayStr(), l.dueDate);
  if(diff===null) return null;
  if(diff<0) return {cls:'due-overdue', label:(diff===-1?'1 day overdue':(-diff)+' days overdue')};
  if(diff===0) return {cls:'due-today', label:'Due today'};
  var weekdays = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  if(diff<=6) return {cls:'due-soon', label:'Due '+weekdays[parseDateStr(l.dueDate).getDay()]};
  return {cls:'due-later', label:'Due '+fmtDate(l.dueDate)};
}
function nextGradeLabel(label){
  if(!label) return '';
  var m = label.match(/(\d+)/);
  if(m){
    var n = parseInt(m[1],10)+1;
    return label.replace(m[1], String(n));
  }
  var order = ['Freshman','Sophomore','Junior','Senior'];
  var idx = order.indexOf(label);
  if(idx!==-1 && idx<order.length-1) return order[idx+1];
  return label;
}

function icon(name){
  var icons = {
    plus:'<path d="M12 5v14M5 12h14"/>',
    pencil:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
    trash:'<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
    download:'<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/>',
    upload:'<path d="M12 21V9"/><path d="M7 14l5-5 5 5"/><path d="M5 21h14"/>',
    check:'<path d="M20 6 9 17l-5-5"/>',
    book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>',
    scroll:'<path d="M8 21h12a2 2 0 0 0 2-2v-2H10v2a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v3h4"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/>',
    x:'<path d="M18 6 6 18"/><path d="M6 6l12 12"/>',
    printer:'<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/>',
    calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>',
    bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
    chevronLeft:'<path d="M15 18l-6-6 6-6"/>',
    chevronRight:'<path d="M9 18l6-6-6-6"/>',
    chevronDown:'<path d="M6 9l6 6 6-6"/>',
    chevronUp:'<path d="M18 15l-6-6-6 6"/>'
  };
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(icons[name]||'')+'</svg>';
}

/* ---------------- default / migrated data ---------------- */
function defaultScale(){
  return [
    {id:uid('g'),letter:'A',min:90,gpa:4.0},
    {id:uid('g'),letter:'B',min:80,gpa:3.0},
    {id:uid('g'),letter:'C',min:70,gpa:2.0},
    {id:uid('g'),letter:'D',min:60,gpa:1.0},
    {id:uid('g'),letter:'F',min:0,gpa:0.0}
  ];
}
function defaultData(){
  var yid = uid('yr');
  return {
    version:2,
    years:[{id:yid, label:'Year 1', mode:'tracked', order:1}],
    activeYearId:yid,
    quarters:[
      {id:uid('q'), yearId:yid, name:'Quarter 1', start:'', end:''},
      {id:uid('q'), yearId:yid, name:'Quarter 2', start:'', end:''},
      {id:uid('q'), yearId:yid, name:'Quarter 3', start:'', end:''},
      {id:uid('q'), yearId:yid, name:'Quarter 4', start:'', end:''}
    ],
    students:[],
    studentYearInfo:[],
    subjects:[],
    lessons:[],
    historicalCourses:[],
    testScores:[],
    previousSchools:[],
    attendance:{},
    holidays:{},
    attendanceOverride:{},
    scale: defaultScale(),
    school:{name:'', administrator:'', principal:'', county:'', schoolId:'', address:'', phone:'', authority:''}
  };
}
// Fields added after the original v2 shape (attendance, holidays,
// testScores, previousSchools, ...) need to be backfilled onto any
// v2-shaped data that predates them — not just on a normal page load, but
// also when restoring an older exported backup, which otherwise bypasses
// this via migrateData's early return below. Centralized here so the two
// paths can't diverge again: a real bug, caught 2026-08-28, where
// restoring a backup from before testScores/previousSchools existed left
// them undefined and crashed the Transcript ("Cannot read properties of
// undefined (reading 'filter')") the moment it tried to render a student
// with real course history.
// Guards every collection field against being missing OR null — not just
// "added after the original v2 shape" fields anymore. Originally written
// for the former only (an old backup predating testScores/previousSchools
// left them undefined — 2026-08-28, crashed the Transcript). Extended
// 2026-08-30 for Multi-device sync v2 (Firebase): Firebase Realtime
// Database silently collapses an empty array or object to `null` when
// written, so any family with zero subjects/lessons/etc. in a given year
// (the normal state at the very start of a new year, like this family's
// real 2026-27) would read every one of those fields back as `null`
// instead of `[]` the moment it round-tripped through Firebase — and the
// exact same class of crash as the backup bug follows. `d.scale` gets the
// same treatment migrateData's v1-upgrade path already gave it, now
// covering the v2-load path too.
function backfillData(d){
  if(!d.years) d.years = [];
  if(!d.quarters) d.quarters = [];
  if(!d.students) d.students = [];
  if(!d.studentYearInfo) d.studentYearInfo = [];
  if(!d.subjects) d.subjects = [];
  if(!d.lessons) d.lessons = [];
  if(!d.historicalCourses) d.historicalCourses = [];
  if(!d.testScores) d.testScores = [];
  if(!d.previousSchools) d.previousSchools = [];
  if(!d.attendance) d.attendance = {};
  if(!d.holidays) d.holidays = {};
  if(!d.attendanceOverride) d.attendanceOverride = {};
  if(!d.scale || !d.scale.length) d.scale = defaultScale();
  if(!d.school) d.school = {name:'', administrator:'', principal:'', county:'', schoolId:'', address:'', phone:'', authority:''};
  return d;
}
// upgrades the family's original single-year shape into the multi-year shape
function migrateData(d){
  if(d && d.version>=2) return backfillData(d);
  var yid = uid('yr');
  var year = {id:yid, label:'2025\u201326', mode:'tracked', order:1};
  var quarters = (d.quarters||[]).map(function(q){ return {id:q.id, yearId:yid, name:q.name, start:q.start||'', end:q.end||''}; });
  var studentYearInfo = (d.students||[]).map(function(s){ return {id:uid('syi'), studentId:s.id, yearId:yid, gradeLabel:s.gradeLevel||''}; });
  var subjects = (d.subjects||[]).map(function(s){
    return {id:s.id, studentId:s.studentId, yearId:yid, name:s.name, unitLabel:s.unitLabel||null, targetTotal:(s.targetTotal!=null?s.targetTotal:null), creditHours:1.0, category:''};
  });
  return backfillData({
    version:2,
    years:[year],
    activeYearId:yid,
    quarters:quarters,
    students:(d.students||[]).map(function(s){ return {id:s.id, name:s.name, color:s.color, gradeLevel:s.gradeLevel||'', dob:''}; }),
    studentYearInfo:studentYearInfo,
    subjects:subjects,
    lessons:d.lessons||[],
    historicalCourses:[],
    testScores:[],
    previousSchools:[],
    attendance:d.attendance||{},
    holidays:d.holidays||{},
    scale:(d.scale && d.scale.length)?d.scale:defaultScale(),
    school:d.school||{name:'',administrator:'',principal:'',county:'',schoolId:'',address:'',phone:'',authority:''}
  });
}

/* ---------------- data lookups ---------------- */
function getStudent(id){ return state.data.students.find(function(s){return s.id===id;}); }
function getSubject(id){ return state.data.subjects.find(function(s){return s.id===id;}); }
function getQuarter(id){ return state.data.quarters.find(function(q){return q.id===id;}); }
function getYear(id){ return state.data.years.find(function(y){return y.id===id;}); }
function activeYear(){ return getYear(state.data.activeYearId) || state.data.years[0]; }
function sortedYears(){ return state.data.years.slice().sort(function(a,b){return a.order-b.order;}); }
function yearQuarters(yearId){ return state.data.quarters.filter(function(q){return q.yearId===yearId;}); }
function studentSubjectsForYear(studentId, yearId){ return state.data.subjects.filter(function(s){return s.studentId===studentId && s.yearId===yearId;}); }
function studentSubjects(studentId){ return studentSubjectsForYear(studentId, state.data.activeYearId); }
function studentLessons(studentId){
  var activeSubjIds = {};
  studentSubjectsForYear(studentId, state.data.activeYearId).forEach(function(s){ activeSubjIds[s.id]=true; });
  return state.data.lessons.filter(function(l){ return l.studentId===studentId && activeSubjIds[l.subjectId]; });
}
function getStudentYearInfo(studentId, yearId){
  return state.data.studentYearInfo.find(function(r){return r.studentId===studentId && r.yearId===yearId;});
}
// Whether un-enrolling this student from this year would orphan real data
// — same "has real data" check used for deleting a year outright, just
// scoped to one student instead of everyone (BACKLOG.md "A way to
// un-enroll a student from a school year").
function studentHasYearData(studentId, yearId){
  var hasSubjects = state.data.subjects.some(function(su){ return su.studentId===studentId && su.yearId===yearId; });
  var hasHistorical = state.data.historicalCourses.some(function(h){ return h.studentId===studentId && h.yearId===yearId; });
  var att = state.data.attendance[studentId];
  var hasAttendance = !!(att && att[yearId] && Object.keys(att[yearId]).length);
  var hasAttendanceOverride = attendanceOverrideDays(studentId, yearId)!=null;
  return hasSubjects || hasHistorical || hasAttendance || hasAttendanceOverride;
}
function gradeLabelFor(studentId, yearId){
  var r = getStudentYearInfo(studentId, yearId);
  return r ? r.gradeLabel : '';
}
// Recognizes a grade label as high-school (9th-12th) for the transcript's
// two-column year pairing — by number ("9th", "12th (final)") or by name
// (Freshman/Sophomore/Junior/Senior). Returns 9-12, or null if the label
// doesn't look like a high-school year (elementary/middle grades, or no
// label at all) — those years render single-column instead of paired.
function hsGradeNumber(label){
  if(!label) return null;
  var s = String(label).toLowerCase();
  var words = {freshman:9, sophomore:10, junior:11, senior:12};
  for(var w in words){ if(s.indexOf(w)!==-1) return words[w]; }
  var m = s.match(/(\d+)/);
  if(m){ var n = parseInt(m[1],10); if(n>=9 && n<=12) return n; }
  return null;
}

/* ---------------- attendance ---------------- */
// Which calendar year "July" falls in for a school year, e.g. 2026 for a
// "2026–27" year. No dedicated field on the year record — years are
// already labeled with their starting year by convention,
// so this just reads that off the label. Falls back to today's date for
// years labeled some other way (e.g. "Kindergarten"); rename the year's
// label to include its start year in Setup → Years if that guess is wrong.
function yearTermStartYear(y){
  var m = (y && y.label || '').match(/(\d{4})/);
  if(m) return parseInt(m[1],10);
  var d = new Date();
  return (d.getMonth()+1>=7) ? d.getFullYear() : d.getFullYear()-1;
}
// The 12 'YYYY-MM' months of a school year, July through June.
function yearMonthList(y){
  var tsy = yearTermStartYear(y);
  var months = [];
  for(var i=0;i<12;i++){
    var mo = ((6+i)%12)+1;
    var yr = mo>=7 ? tsy : tsy+1;
    months.push(yr+'-'+String(mo).padStart(2,'0'));
  }
  return months;
}
function daysInMonthOf(ym){
  var parts = ym.split('-');
  return new Date(parseInt(parts[0],10), parseInt(parts[1],10), 0).getDate();
}
// map of 'YYYY-MM-DD' -> true for days marked "instruction conducted"
function attendanceDates(studentId, yearId){
  var a = state.data.attendance[studentId];
  return (a && a[yearId]) || {};
}
function isAttendanceDay(studentId, yearId, dateStr){
  return !!attendanceDates(studentId, yearId)[dateStr];
}
// A historical year can carry a direct "total days" number instead of a
// day-by-day grid (BACKLOG.md "Historical attendance: enter total days
// instead of the day-by-day grid") — set, it wins over the grid count;
// grid data underneath is untouched either way, so clearing it reverts to
// counting checked days.
function attendanceOverrideDays(studentId, yearId){
  var byYear = state.data.attendanceOverride[studentId];
  var v = byYear && byYear[yearId];
  return (v==null) ? null : v;
}
function doAttendanceOverrideSet(studentId, yearId, raw){
  if(!studentId || !yearId) return;
  mutateAndSave(function(){
    if(!state.data.attendanceOverride[studentId]) state.data.attendanceOverride[studentId] = {};
    var byYear = state.data.attendanceOverride[studentId];
    if(raw===''||raw==null){
      delete byYear[yearId];
    } else {
      var n = Number(raw);
      if(!isNaN(n)) byYear[yearId] = n;
    }
  });
}
function attendanceCountForYear(studentId, yearId){
  var override = attendanceOverrideDays(studentId, yearId);
  if(override!=null) return override;
  return Object.keys(attendanceDates(studentId, yearId)).length;
}
function doAttendanceToggle(studentId, yearId, dateStr){
  if(!studentId || !yearId || !dateStr) return;
  mutateAndSave(function(){
    if(!state.data.attendance[studentId]) state.data.attendance[studentId] = {};
    if(!state.data.attendance[studentId][yearId]) state.data.attendance[studentId][yearId] = {};
    var set = state.data.attendance[studentId][yearId];
    if(set[dateStr]) delete set[dateStr]; else set[dateStr] = true;
  });
}
// Mark every weekday in [fromStr, toStr] as instruction-conducted in one
// go (BACKLOG.md "Attendance: bulk-mark a date range instead of one day
// at a time") — an alternative to clicking every day in the grid, not a
// new data shape: same additive doAttendanceToggle-style write, just
// looped. Weekends and already-holiday-marked days are skipped, already-
// checked days are left alone (additive only), and a range reaching
// outside the school year's Jul-Jun bounds is silently clamped to it
// rather than rejected.
function doAttendanceMarkRange(studentId, yearId, fromStr, toStr){
  var year = getYear(yearId);
  if(!studentId || !year || !fromStr || !toStr){ showToast('Pick a start and end date first.', true); return; }
  if(fromStr > toStr){ var tmp = fromStr; fromStr = toStr; toStr = tmp; }
  var months = yearMonthList(year);
  var minDate = months[0]+'-01';
  var lastYm = months[months.length-1];
  var maxDate = lastYm+'-'+String(daysInMonthOf(lastYm)).padStart(2,'0');
  if(fromStr < minDate) fromStr = minDate;
  if(toStr > maxDate) toStr = maxDate;
  if(fromStr > toStr){ showToast('That range doesn’t overlap this school year.', true); return; }
  var marked = 0;
  mutateAndSave(function(){
    if(!state.data.attendance[studentId]) state.data.attendance[studentId] = {};
    if(!state.data.attendance[studentId][yearId]) state.data.attendance[studentId][yearId] = {};
    var set = state.data.attendance[studentId][yearId];
    var d = fromStr;
    while(d <= toStr){
      var dow = parseDateStr(d).getDay();
      if(dow!==0 && dow!==6 && !isHoliday(yearId, d) && !set[d]){
        set[d] = true;
        marked++;
      }
      d = addDaysStr(d, 1);
    }
  });
  showToast(marked ? ('Marked '+marked+' day'+(marked===1?'':'s')+' as instruction conducted.') : 'No new weekdays to mark in that range.');
}
// map of 'YYYY-MM-DD' -> true for holidays/breaks — one shared calendar per
// school year (all students follow the same breaks), not per student.
function holidayDates(yearId){
  return state.data.holidays[yearId] || {};
}
function isHoliday(yearId, dateStr){
  return !!holidayDates(yearId)[dateStr];
}
function doHolidayToggle(yearId, dateStr){
  if(!yearId || !dateStr) return;
  mutateAndSave(function(){
    if(!state.data.holidays[yearId]) state.data.holidays[yearId] = {};
    var set = state.data.holidays[yearId];
    if(set[dateStr]){
      delete set[dateStr];
    } else {
      set[dateStr] = true;
      // a shared holiday means nobody had school that day — clear any
      // instruction-conducted mark for every student, not just whoever's
      // grid is currently open
      state.data.students.forEach(function(s){
        var byYear = state.data.attendance[s.id];
        if(byYear && byYear[yearId]) delete byYear[yearId][dateStr];
      });
    }
  });
}

function letterBand(pct, scale){
  var bands = scale.slice().sort(function(a,b){ return b.min - a.min; });
  for(var i=0;i<bands.length;i++){
    if(pct >= bands[i].min) return bands[i];
  }
  return bands[bands.length-1] || null;
}
function letterClass(letter){
  if(!letter) return 'grade-none';
  var c = letter.charAt(0);
  if(c==='A') return 'grade-A';
  if(c==='B') return 'grade-B';
  if(c==='C') return 'grade-C';
  if(c==='D') return 'grade-D';
  return 'grade-F';
}

// pooled points across graded lessons in a subject+quarter
function quarterAggregate(studentId, subjectId, quarterId){
  var lessons = state.data.lessons.filter(function(l){
    return l.studentId===studentId && l.subjectId===subjectId && l.quarterId===quarterId &&
           l.status==='done' && l.possible!=null && l.actual!=null && Number(l.possible)>0;
  });
  if(!lessons.length) return null;
  var sa=0, sp=0;
  lessons.forEach(function(l){ sa+=Number(l.actual); sp+=Number(l.possible); });
  var pct = sp>0 ? (sa/sp*100) : null;
  if(pct===null) return null;
  var band = letterBand(pct, state.data.scale);
  return {pct:pct, sumActual:sa, sumPossible:sp, count:lessons.length, letter:band?band.letter:null, gpa:band?band.gpa:null};
}
// cumulative = average of the quarter percentages (within that subject's own year) that have graded work
function cumulativeAggregate(studentId, subjectId){
  var subj = getSubject(subjectId);
  if(!subj) return null;
  var pcts = [];
  yearQuarters(subj.yearId).forEach(function(q){
    var agg = quarterAggregate(studentId, subjectId, q.id);
    if(agg) pcts.push(agg.pct);
  });
  if(!pcts.length) return null;
  var avg = pcts.reduce(function(a,b){return a+b;},0)/pcts.length;
  var band = letterBand(avg, state.data.scale);
  return {pct:avg, letter:band?band.letter:null, gpa:band?band.gpa:null};
}
// Subjects with at least some graded (Done) work this year — used to keep
// untouched subjects off the report card rather than showing an all-dash row.
function reportSubjectsFor(studentId){
  return studentSubjects(studentId).filter(function(su){
    return cumulativeAggregate(studentId, su.id)!=null;
  });
}

/* ---------------- storage ---------------- */
function loadData(){
  var finish = function(){
    state.data = migrateData(state.data); // backfillData() runs inside, for both a fresh v2 load and an upgraded v1 one
    state.loaded = true;
    if(!state.activeStudentId && state.data.students.length) state.activeStudentId = state.data.students[0].id;
    if(!state.reportStudentId && state.data.students.length) state.reportStudentId = state.data.students[0].id;
    if(!state.transcriptStudentId && state.data.students.length) state.transcriptStudentId = state.data.students[0].id;
    if(!state.diplomaStudentId && state.data.students.length) state.diplomaStudentId = state.data.students[0].id;
    if(!state.attendanceStudentId && state.data.students.length) state.attendanceStudentId = state.data.students[0].id;
    if(!state.subjectsYearId) state.subjectsYearId = state.data.activeYearId;
    render();
    checkDueNotifications(false);
    maybeInitFirebaseSync();
  };
  if(!HAS_STORAGE){
    state.data = defaultData();
    state.loadError = true;
    finish();
    return;
  }
  if(HAS_ARTIFACT_STORAGE){
    window.storage.get(STORAGE_KEY, false).then(function(res){
      if(res && res.value){
        try{ state.data = JSON.parse(res.value); } catch(e){ state.data = defaultData(); }
      } else {
        state.data = defaultData();
      }
      finish();
    }).catch(function(err){
      console.error('Homeroom: load failed', err);
      state.data = defaultData();
      state.loadError = true;
      finish();
    });
    return;
  }
  // localStorage path
  try{
    var raw = window.localStorage.getItem(STORAGE_KEY);
    if(raw){
      try{ state.data = JSON.parse(raw); } catch(e){ state.data = defaultData(); }
    } else {
      state.data = defaultData();
    }
  }catch(err){
    console.error('Homeroom: load failed', err);
    state.data = defaultData();
    state.loadError = true;
  }
  finish();
}
function saveData(){
  saveLocalOnly();
  if(HAS_FIREBASE && syncMode()==='firebase' && firebaseUser){
    pushToFirebase().catch(function(e){ console.error('Homeroom: sync push failed', e); syncHasUnpushedLocalChanges = true; });
  }
}
// The pre-sync save path, kept as its own function: this device's own working
// copy, always written regardless of sync mode (so the device still has
// something to show if the cloud is briefly unreachable).
function saveLocalOnly(){
  if(!HAS_STORAGE) return;
  if(HAS_ARTIFACT_STORAGE){
    try{
      window.storage.set(STORAGE_KEY, JSON.stringify(state.data), false).then(function(res){
        if(!res) showToast('Could not save changes.', true);
      }).catch(function(){ showToast('Could not save changes.', true); });
    }catch(e){ console.error(e); }
    return;
  }
  try{
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
  }catch(e){
    console.error(e);
    showToast('Could not save changes.', true);
  }
}
function showToast(msg, isErr){
  var t = el('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr?' error':'');
  if(state.toastTimer) clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(function(){ t.className='toast'; }, 2400);
}

/* ---------------- multi-device sync (Firebase Realtime Database) ----------------
   Opt-in per device (BACKLOG.md "Multi-device sync v2: Firebase backend").
   Once signed in, this device reads/writes state.data through one shared
   family record in Firebase, instead of only this browser's own storage.
   Works on any modern browser — including Safari on iPad and Chrome on
   Android, unlike the File System Access mechanism this replaced. Firebase
   Auth persists sign-in across reloads on its own (no IndexedDB bookkeeping
   needed here, unlike the old file-handle approach), so "needs reconnect"
   should only come up if a device is explicitly signed out or a token
   genuinely expires. */
function fbRoot(){ return firebase.database().ref('homeroom'); }

function firebaseAuthErrorMessage(e){
  var code = e && e.code;
  if(code==='auth/wrong-password' || code==='auth/invalid-credential') return 'Incorrect email or password.';
  if(code==='auth/user-not-found') return 'No account with that email.';
  if(code==='auth/invalid-email') return 'That doesn’t look like a valid email.';
  if(code==='auth/too-many-requests') return 'Too many attempts — wait a bit and try again.';
  if(code==='auth/network-request-failed') return 'Couldn’t reach the sync service — check your internet connection.';
  return 'Could not sign in.';
}

// Runs once at startup (from loadData's finish()). Firebase Auth resolves
// the persisted sign-in (or lack of one) asynchronously; this fires once
// immediately with whatever that turns out to be, and again on any future
// sign-out.
function maybeInitFirebaseSync(){
  if(!HAS_FIREBASE || syncMode()!=='firebase') return;
  firebase.auth().onAuthStateChanged(function(user){
    firebaseUser = user;
    if(user){
      state.syncNeedsReconnect = false;
      pullFromFirebase().then(startFirebaseListener).catch(function(e){ console.error('Homeroom: sync init failed', e); });
    } else {
      stopFirebaseListener();
      state.syncNeedsReconnect = true;
      render();
    }
  });
}

function startFirebaseListener(){
  if(firebaseMetaListenerRef) return;
  firebaseMetaListenerRef = fbRoot().child('meta');
  firebaseMetaListenerRef.on('value', onFirebaseMetaChange);
}
function stopFirebaseListener(){
  if(firebaseMetaListenerRef){ firebaseMetaListenerRef.off('value', onFirebaseMetaChange); firebaseMetaListenerRef = null; }
}
// Live listener in place of the old mechanism's 60s poll — Realtime Database
// pushes changes instead of needing to be asked. Only ever flags that
// something changed; never overwrites what's on screen on its own. Ignores
// this device's own writes (matched by deviceId) so a device doesn't mistake
// its own save for a remote one.
function onFirebaseMetaChange(snap){
  var meta = snap.val();
  if(!meta || meta.writerId===deviceId()) return;
  if(firebaseLastKnownTimestamp!==null && meta.lastModified!=null && meta.lastModified > firebaseLastKnownTimestamp && !state.syncFileChangedRemotely){
    state.syncFileChangedRemotely = true;
    render();
  }
}

// Reads the family record and adopts it as this device's data (replacing
// whatever was here) — used on connect, reconnect, and "reload latest".
async function pullFromFirebase(){
  var dataSnap = await fbRoot().child('data').once('value');
  var parsed = dataSnap.val();
  if(parsed && Array.isArray(parsed.students)){
    state.data = migrateData(parsed); // backfillData() runs inside
  }
  var metaSnap = await fbRoot().child('meta').once('value');
  var meta = metaSnap.val();
  firebaseLastKnownTimestamp = meta ? meta.lastModified : null;
  state.syncNeedsReconnect = false;
  state.syncFileChangedRemotely = false;
  syncHasUnpushedLocalChanges = false; // local now matches what we just adopted
  saveLocalOnly();
  render();
}
// Writes state.data to the family record. Conflict guard: if the cloud
// changed since we last read it (another device saved in between), skip the
// write and flag it instead of silently clobbering that other change — this
// device's own local copy is already saved separately either way.
async function pushToFirebase(skipConflictCheck){
  if(!firebaseUser) return;
  if(!skipConflictCheck){
    var metaSnap = await fbRoot().child('meta').once('value');
    var meta = metaSnap.val();
    if(firebaseLastKnownTimestamp!=null && meta && meta.lastModified!=null && meta.lastModified > firebaseLastKnownTimestamp){
      state.syncFileChangedRemotely = true;
      syncHasUnpushedLocalChanges = true;
      render();
      return;
    }
  }
  var updates = {};
  updates['homeroom/data'] = state.data;
  updates['homeroom/meta/lastModified'] = firebase.database.ServerValue.TIMESTAMP;
  updates['homeroom/meta/writerId'] = deviceId();
  await firebase.database().ref().update(updates);
  syncHasUnpushedLocalChanges = false; // this device's state.data is now what's in the cloud
  var after = await fbRoot().child('meta').once('value');
  var afterMeta = after.val();
  firebaseLastKnownTimestamp = afterMeta ? afterMeta.lastModified : null;
}

// Shared by both the first-ever Connect and a later Reconnect (after a
// sign-out) — Firebase sign-in doesn't need a new "file" each time the way
// the old picker-based Connect did, so one flow covers both.
async function doFirebaseSignIn(){
  if(!HAS_FIREBASE){ showToast('Sync isn’t available — check your internet connection and reload.', true); return; }
  var email = ((el('firebase-email-input')||{}).value||'').trim();
  var password = (el('firebase-password-input')||{}).value||'';
  if(!email || !password){ showToast('Enter the family email and password.', true); return; }
  try{
    await firebase.auth().signInWithEmailAndPassword(email, password);
  }catch(e){
    showToast(firebaseAuthErrorMessage(e), true);
    return;
  }
  firebaseUser = firebase.auth().currentUser;
  var wasAlreadyConnected = syncMode()==='firebase';
  try{
    var dataSnap = await fbRoot().child('data').once('value');
    var parsed = dataSnap.val();
    var hasRealData = parsed && Array.isArray(parsed.students);
    if(!hasRealData && !wasAlreadyConnected){
      // No family data in the cloud yet — either genuinely first-ever setup,
      // or (rarer here than with the old per-file version, but still
      // possible) a rules/typo issue silently reading empty. Don't guess:
      // confirm before adopting this device's data as the family's.
      var proceed = window.confirm(
        'No family data found in the cloud yet.\n\n' +
        'Continue and set this device’s current data as the starting point for the family?'
      );
      if(!proceed){ showToast('Sign-in cancelled — nothing was changed.'); return; }
    }
    setSyncMode('firebase');
    state.syncNeedsReconnect = false;
    state.syncFileChangedRemotely = false;
    syncHasUnpushedLocalChanges = false;
    if(hasRealData){
      state.data = migrateData(parsed); // backfillData() runs inside
      var metaSnap = await fbRoot().child('meta').once('value');
      var meta = metaSnap.val();
      firebaseLastKnownTimestamp = meta ? meta.lastModified : null;
      saveLocalOnly();
      showToast(wasAlreadyConnected ? 'Reconnected.' : 'Connected — pulled in the data already in the cloud.');
    } else {
      await pushToFirebase(true);
      showToast('Connected — the cloud now holds this device’s data.');
    }
    startFirebaseListener();
    render();
  }catch(e){
    console.error(e);
    showToast('Could not connect to the sync service.', true);
  }
}
async function doFirebaseDisconnect(){
  stopFirebaseListener();
  try{ await firebase.auth().signOut(); }catch(e){ console.error(e); }
  firebaseUser = null;
  firebaseLastKnownTimestamp = null;
  state.syncNeedsReconnect = false;
  state.syncFileChangedRemotely = false;
  syncHasUnpushedLocalChanges = false;
  setSyncMode('local');
  showToast('Disconnected — this device is back to local-only data.');
  render();
}
// Reconnect and Reload-latest both pull from the cloud and overwrite
// state.data outright. If this device made changes that never made it up
// (signed out, or the conflict guard held them back — see
// syncHasUnpushedLocalChanges above), ask before silently discarding them
// instead of just doing it. Returns true if it's safe to go ahead and pull;
// false if it already resolved things another way (pushed this device's
// changes instead) and the caller should stop here.
async function resolveUnpushedBeforePull(){
  if(!syncHasUnpushedLocalChanges) return true;
  var keepLocal = window.confirm(
    'This device made changes that haven’t been saved to the cloud yet.\n\n' +
    'Press OK to keep this device’s changes — they’ll be saved to the cloud ' +
    'now. Press Cancel to discard them and load what’s currently in the ' +
    'cloud instead.'
  );
  if(keepLocal){
    await pushToFirebase(true);
    showToast('Kept this device’s changes — saved to the cloud.');
    return false;
  }
  syncHasUnpushedLocalChanges = false;
  return true;
}
async function doSyncReloadLatest(){
  if(!firebaseUser){ state.syncFileChangedRemotely = false; render(); return; }
  try{
    if(!(await resolveUnpushedBeforePull())){ state.syncFileChangedRemotely = false; render(); return; }
    await pullFromFirebase(); showToast('Reloaded the latest data.');
  }
  catch(e){ console.error(e); showToast('Could not reload.', true); }
}

/* ---------------- due-date reminders (browser notifications) ----------------
   Device-level preference, not family data, so this lives in its own
   localStorage keys rather than inside state.data (which is what gets synced
   via saveData / window.storage). Nothing here can page you if the tab or
   browser is closed — it only checks while Homeroom is open. */
var NOTIFY_ENABLED_KEY = 'homeroom-notify-enabled';
var NOTIFY_LAST_KEY = 'homeroom-notify-last-date';
var NOTIFY_CHECK_INTERVAL_MS = 10 * 60 * 1000;
function notifySupported(){ return HAS_LOCAL_STORAGE && typeof window!=='undefined' && 'Notification' in window; }
function notifyEnabled(){
  if(!notifySupported()) return false;
  return window.localStorage.getItem(NOTIFY_ENABLED_KEY)==='1' && Notification.permission==='granted';
}
function renderNotifyToggle(){
  var host = el('notify-toggle-host');
  if(!host) return;
  if(!notifySupported()){ host.innerHTML=''; return; }
  var on = notifyEnabled();
  host.innerHTML = '<button class="bell-btn'+(on?' is-on':'')+'" data-action="notify-toggle" title="'+(on?'Reminders are on — click to turn off':'Turn on due-date reminders')+'">'+icon('bell')+(on?'On':'Off')+'</button>';
}
function doNotifyToggle(){
  if(!notifySupported()){ showToast('This browser doesn’t support notifications.', true); return; }
  if(notifyEnabled()){
    window.localStorage.setItem(NOTIFY_ENABLED_KEY, '0');
    showToast('Reminders turned off.');
    renderNotifyToggle();
    return;
  }
  Notification.requestPermission().then(function(perm){
    if(perm==='granted'){
      window.localStorage.setItem(NOTIFY_ENABLED_KEY, '1');
      showToast('Reminders on — you’ll get a notification for overdue and due-today work while Homeroom is open.');
      checkDueNotifications(true);
    } else {
      window.localStorage.setItem(NOTIFY_ENABLED_KEY, '0');
      showToast('Notification permission was not granted.', true);
    }
    renderNotifyToggle();
  }).catch(function(){ showToast('Could not request notification permission.', true); });
}
// scans every student's lessons for overdue / due-today work; fires at most
// one notification per calendar day unless force is passed (right after opt-in)
function checkDueNotifications(force){
  if(!notifyEnabled() || !state.data) return;
  var last = window.localStorage.getItem(NOTIFY_LAST_KEY);
  var today = todayStr();
  if(!force && last===today) return;
  var overdue = 0, dueToday = 0;
  state.data.lessons.forEach(function(l){
    if(l.status==='done' || !l.dueDate) return;
    if(l.dueDate < today) overdue++;
    else if(l.dueDate === today) dueToday++;
  });
  window.localStorage.setItem(NOTIFY_LAST_KEY, today);
  if(overdue===0 && dueToday===0) return;
  var parts = [];
  if(overdue) parts.push(overdue+' overdue');
  if(dueToday) parts.push(dueToday+' due today');
  try{
    new Notification('Homeroom', {body: parts.join(' · ')+' — open Homeroom to check the Calendar.'});
  }catch(e){ console.error('Homeroom: notification failed', e); }
}

/* ---------------- completion celebration ----------------
   Fires whenever a lesson's status becomes 'review' — visual confetti +
   a short chime, so finishing an assignment feels like something. Like the
   notification opt-in, this is a device-level preference, not family data,
   so it lives in its own localStorage key rather than state.data. */
var CELEBRATE_ENABLED_KEY = 'homeroom-celebrate-enabled';
var celebrateEnabledFallback = true; // used only when localStorage is unavailable
function celebrateEnabled(){
  if(!HAS_LOCAL_STORAGE) return celebrateEnabledFallback;
  var v = window.localStorage.getItem(CELEBRATE_ENABLED_KEY);
  return v===null ? true : v==='1'; // default on
}
function setCelebrateEnabled(on){
  celebrateEnabledFallback = on;
  if(HAS_LOCAL_STORAGE){
    try{ window.localStorage.setItem(CELEBRATE_ENABLED_KEY, on?'1':'0'); }catch(e){}
  }
}
function doCelebrateToggle(){
  setCelebrateEnabled(!celebrateEnabled());
  renderCelebrateToggle();
  showToast(celebrateEnabled() ? 'Celebrations on.' : 'Celebrations off.');
}
function renderCelebrateToggle(){
  var host = el('celebrate-toggle-host');
  if(!host) return;
  var on = celebrateEnabled();
  host.innerHTML = '<button class="bell-btn'+(on?' is-on':'')+'" data-action="celebrate-toggle" title="'+(on?'Completion celebrations are on — click to turn off':'Turn on completion celebrations')+'">🎉 '+(on?'On':'Off')+'</button>';
}
var CONFETTI_COLORS = ['#3C6E5C','#48588A','#8C4A57','#B9873A','#F2EFE6'];
function fireConfetti(){
  try{
    var overlay = document.createElement('div');
    overlay.className = 'confetti-overlay';
    var count = 26;
    for(var i=0;i<count;i++){
      var piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = (Math.random()*100)+'%';
      piece.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
      piece.style.setProperty('--dur', (0.9+Math.random()*0.6).toFixed(2)+'s');
      piece.style.setProperty('--delay', (Math.random()*0.2).toFixed(2)+'s');
      overlay.appendChild(piece);
    }
    document.body.appendChild(overlay);
    setTimeout(function(){ overlay.remove(); }, 1800);
  }catch(e){ console.error('Homeroom: confetti failed', e); }
}
function playChime(){
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    var ctx = new Ctx();
    var now = ctx.currentTime;
    [[523.25, now, 0.14], [659.25, now+0.12, 0.22]].forEach(function(note){
      var osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = note[0];
      gain.gain.setValueAtTime(0.0001, note[1]);
      gain.gain.exponentialRampToValueAtTime(0.2, note[1]+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, note[1]+note[2]);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(note[1]); osc.stop(note[1]+note[2]+0.02);
    });
    setTimeout(function(){ try{ ctx.close(); }catch(e){} }, 700);
  }catch(e){ console.error('Homeroom: chime failed', e); }
}
function celebrate(){
  if(!celebrateEnabled()) return;
  fireConfetti();
  playChime();
}
